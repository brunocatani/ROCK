; ROCK.ini - supported user configuration
;
; SHIPPED AUTHORITY: this is the only INI embedded, packaged, deployed, and
; automatically created by ROCK. It contains stable user preferences and
; compatibility controls only. Missing settings use production code defaults.
;
; Advanced settings remain loadable when copied manually from ROCK.dev.ini.
; Do not add a setting here only because the runtime can parse it. A shipped
; setting must be an intentional, supported user control.


[Config]

iSchemaVersion = 1


[Core]

; Enables or disables ROCK interaction systems.
bEnabled = true


[WeaponHandedness]

; Selects ROCK's equipped-weapon hand. This does not change Fallout 4 VR or FRIK handedness.
bLeftHandedMode = false


[Input]

; Stops right stick click from opening Favorites.
bSuppressRightFavoritesGameInput = true

; Function-level VATS and V.A.N.S. compatibility controls.
bSuppressNativeVats = true
bSuppressNativeVans = true

; A short physical-Y press opens the Pip-Boy. A hold opens Pause.
fPipboyPauseHoldSeconds = 0.35

; Prevents native actions from conflicting with a ROCK-held object.
bSuppressPipboyGameInputWhileHolding = true
bSuppressTakeEquipGameInputWhileHolding = true


[Gunstock]

; Enables and calibrates physical-gunstock alignment.
bAlignBarrelToControllerForward = false
fAlignmentPitchDegrees = -10.0
fAlignmentYawDegrees = 0.0
fAlignmentRollDegrees = 0.0


[AmbidextrousFiring]

; Allows either hand to inherit the equipped weapon firing grip.
bAmbidextrousFiringGripEnabled = true


[NativeScopes]

; Hold time required to activate a native scope.
fManualScopeHoldSeconds = 0.30


[RealisticWeapons]

; Grenade fuse time in seconds. Zero uses the native projectile fuse.
fRealisticGrenadeFuseSeconds = 5.0


[SelectionFeedback]

; Grab-target highlight and selection beam.
bHighlightEnabled = true
iHighlightIntensityMode = 1
sHighlightColor = blue
bSelectionBeamEnabled = true


[WeaponCollision]

; Equipped-weapon collision and projectile/spell compatibility.
bWeaponCollisionEnabled = true
bWeaponCollisionBlocksProjectiles = false
bWeaponCollisionBlocksSpells = false


[DynamicHandCollision]

; Dynamic hand collision, movable-object interaction, and contact haptics.
bHandCollisionDynamicDrive = true
bHandDynamicInteractionsEnabled = true
bHandCollisionDynamicHapticsEnabled = true


[Experimental]

; Compatibility and performance escape hatch for generated body colliders.
bBodyBoneCollidersEnabled = true


[NativeSuppression]

; Prevents the native player controller bubble from pushing nearby objects.
bNativeCharacterControllerObjectContactFilterEnabled = true


[PhysicsInteraction]

; High-level interaction preferences.
bGlobalSurfaceGrabEnabled = true
bFarSelectionHmdConeEnabled = true
iGrabButtonID = 2
fThrowVelocityMultiplier = 1.5
bGrabHeldMassMovementSlowdownEnabled = true

; Shoulder inventory behavior.
bShoulderStashEnabled = true
bEquippedWeaponShoulderStashEnabled = true
bShoulderStashShowCollectedNotifications = true

; Mouth consumption behavior.
bMouthConsumeEnabled = true
bMouthConsumeAllowPoison = false

; High-level haptic controls.
bGrabHapticsEnabled = true
bSurfaceGrabHapticsEnabled = true
bHeldImpactHapticsEnabled = true
bShoulderStashHapticsEnabled = true
bMouthConsumeHapticsEnabled = true
