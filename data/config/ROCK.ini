; ROCK.ini - Realistic Overengineered Character Kinetics for Fallout 4 VR
;
; This file is grouped by what a user is likely to tune.
; Section names like [Debug] and [PhysicsInteraction] are read by the plugin.
; Headings that start with "; ---" are comments only.
;
; Unit notes:
; - "game units" are Fallout world units.
; - "Havok units" are meters. In FO4VR, 1 Havok meter is about 70 game units.
; - Hex filter values are written without "0x".
;
; Missing keys use the compiled defaults. Keep a backup before tuning.


[Debug]

; --- Main Log File ---
; ROCK.log detail level for normal plugin messages.
; Modes: 0=trace, 1=debug, 2=info, 3=warn, 4=error, 5=critical, 6=off.
; Gates advanced/tuning-only features not meant for normal play. Currently:
; pressing A while holding an object records/overwrites a saved grab offset
; for that object+hand. Saved offsets keep applying on future grabs
; regardless of this setting - it only gates recording new ones.
bDeveloperModeEnabled = false

; Trace/debug/info can be expensive if hot-path diagnostics are enabled.
; Set 6 to keep the main ROCK.log silent during performance testing.
iLogLevel = 1

; Text format for each ROCK.log line.
sLogPattern = %Y-%m-%d %H:%M:%S.%e [%l] %v

; Minimum time between repeated sampled diagnostic messages.
iLogSampleMilliseconds = 2000

; --- Async Performance Profiler ---
; Independent from iLogLevel. When enabled, timing scopes stay on the frame path,
; but completed profiler windows are queued to a bounded background writer.
; Output goes to ROCK_Profiler.log, not ROCK.log. File formatting/writes are not done
; by grab, reload, physics, or frame update code. If the writer falls behind, profiler
; windows are dropped instead of stalling gameplay.
bPerformanceProfilerEnabled = false

; Number of frames per queued profiler window after warmup. Larger values reduce file traffic.
iPerformanceProfilerLogIntervalFrames = 300

; Startup/reload frames ignored before profiler windows are emitted.
iPerformanceProfilerWarmupFrames = 120

; Draws latest profiler window as in-game overlay text. Leave false for clean file-only profiling.
bPerformanceProfilerOverlayText = false


[RealisticWeapons]

; Seconds from pin pull to ROCK detonation. Set 0 to use the grenade projectile's native fuse timer.
fRealisticGrenadeFuseSeconds = 5.0


[WeaponHandedness]

; ROCK-exclusive fixed equipped-weapon hand. False keeps the weapon in the
; physical right hand; true makes the physical left hand the default/fallback.
; This does not read or change Fallout 4 VR/FRIK's native handedness option and
; never changes ROCK's physical button mapping.
bLeftHandedMode = false


[AmbidextrousFiring]

; ROCK's standalone/fallback firing-grip policy. Either hand can inherit the
; firing grip when the current firing hand opens while the other hand is
; wrapped over it. A loose weapon held in the left hand can also be equipped
; directly with that same hand's trigger. An active ROCK Immersive Weapons
; lease explicitly overrides this switch and the tuning below; disabling or
; removing that addon returns to these values.
; With realistic handling unavailable or disabled there is no firing-hand
; detach, part carry, drop, or grip-zone settle equip: firing ownership changes
; only by handoff, direct trigger-equip, an external/native holster, or
; weapon-state cleanup.
; Requires the matching hFRIK weapon-pose and weapon-node ownership APIs;
; fails closed to the configured fixed firing hand when unavailable.
bAmbidextrousFiringGripEnabled = true

; A support hand wrapped over the firing grip takes it over in place when the
; firing hand opens, if its grip point is within this distance of the firing
; grip. Game units (~1.4cm).
fFiringGripPromotionRadius = 5.0

; Global trim for the LEFT-hand firing hold. Rotation is in degrees, range
; -30..30. Position offsets are game units, range -15..15. Zero values keep
; ROCK's mirrored per-weapon firing hold without additional global correction.
fLeftFiringAimYawDegrees = 0.0
fLeftFiringAimPitchDegrees = 0.0
fLeftFiringAimOffsetXGameUnits = 0.0
fLeftFiringAimOffsetYGameUnits = 0.0
fLeftFiringAimOffsetZGameUnits = 0.0


[NativeScopes]

; true keeps ROCK's generated-Sight cone activation. false (default) replaces
; the cone with the lower face button on the physical firing hand: hold right A
; or left X past the threshold to activate, keep holding to remain scoped, and
; release to exit. Releasing before the threshold dispatches reload once.
bAutoActivateScope = false
fManualScopeHoldSeconds = 0.30

; Missing or unusable generated Scope/Sight geometry falls back to the current
; firing-grip palm seat. Set the force switch only when ROCK accepts a bad
; optic collider and you need to bypass it while tuning. Offsets are game units
; from that firing-grip origin in Weapon-local axes: X lateral, +Y muzzle
; forward, and Z vertical. Zeroes place the anchor exactly at the firing grip.
; Rotations are additive degrees after native camera calibration: pitch about
; X, yaw about Z, and roll about +Y/the muzzle axis. Position moves activation,
; camera, and overlay together; rotation corrects the camera and overlay only.
bNativeScopeForceFiringGripFallback = false
fNativeScopeFiringGripFallbackOffsetXGameUnits = 0.0
fNativeScopeFiringGripFallbackOffsetYGameUnits = 0.0
fNativeScopeFiringGripFallbackOffsetZGameUnits = 0.0
fNativeScopeFiringGripFallbackPitchDegrees = 0.0
fNativeScopeFiringGripFallbackYawDegrees = 0.0
fNativeScopeFiringGripFallbackRollDegrees = 0.0

; Fine-tunes only FO4VR's game-native world_scope.nif overlay. ROCK keeps the
; activation camera on the resolved generated-sight/firing-grip anchor
; independently, so these values do not change when the native scope activates.
; Zero values keep automatic anchor placement plus Bethesda's native
; model orientation/scale. Offsets are game units in the calibrated model-local
; frame. Rotations are degrees: pitch about local X, yaw about local Z, and roll
; about the optical/depth Y axis. Tune one axis at a time; loose replacement
; NIFs can use a visually reversed sign convention.
fNativeScopeOverlayOffsetXGameUnits = 0.0
fNativeScopeOverlayOffsetYGameUnits = 0.0
fNativeScopeOverlayOffsetZGameUnits = 0.0
fNativeScopeOverlayPitchDegrees = 0.0
fNativeScopeOverlayYawDegrees = 0.0
fNativeScopeOverlayRollDegrees = 0.0


[Experimental]

; Generated body colliders are experimental. Hand and finger colliders remain
; controlled independently by iHandColliderRuntimeMode under [PhysicsInteraction].

; Creates generated keyframed colliders for the torso, arms, legs, and feet.
; False disables the entire body set while leaving hand and finger colliders alive.
bBodyBoneCollidersEnabled = true

; Adds the experimental leg and foot colliders to the generated body set.
; False keeps torso and arm colliders while omitting every leg and foot body.
bBodyBoneLegAndFootCollidersEnabled = false


[PhysicsInteraction]

; ============================================================================
; 1. Main Switches
; ============================================================================

; Turns all ROCK interaction work on or off.
; False disables hand collision, object selection, grabs, constraints, and weapon collision updates.
bEnabled = true

; ============================================================================
; 2. Controller Input
; ============================================================================

; Lets ROCK intercept raw VR buttons before Fallout VR consumes them.
; Keep enabled if right grip should grab objects without also readying the weapon.
bInputRemapEnabled = true

; Stops right grip from reaching the base game while holstered, so grip can be ROCK grab.
; When a weapon is drawn, grip can still pass through for vanilla reload behavior.
bSuppressRightGrabGameInput = true

; Stops the right stick click from opening Favorites, keeping the button clean
; for ROCK's own thumbstick-click gestures (e.g. saved grab offsets) and for
; external mods/API consumers reading raw controller state.
bSuppressRightFavoritesGameInput = true

; Blocks Fallout VR's automatic weapon ready behavior while holstered.
; This prevents trigger/grip from unexpectedly drawing the weapon during object interaction.
bSuppressNativeReadyWeaponAutoReady = true

; Blocks Fallout VR's native grenade/throw action while ROCK owns gameplay grab input.
; This does not mutate raw OpenVR grip state, so other plugins can still read it.
bSuppressNativeMeleeThrowGameInput = true

; Blocks only ordinary VATS, which fires when the native VATS button is released.
; The raw OpenVR button remains readable, and V.A.N.S. hold still works unless
; bSuppressNativeVans is also true.
bSuppressNativeVats = false

; Blocks only V.A.N.S., which fires while the native VATS button is held.
; The raw OpenVR button remains readable, and release-to-VATS still works unless
; bSuppressNativeVats is also true.
bSuppressNativeVans = false

; ROCK owns the native Pause button during gameplay. Releasing it before this
; threshold opens the Pip-Boy; holding through the threshold opens Pause. On
; Quest 2 this is Y in right-handed mode and follows Bethesda's secondary-wand
; mapping in left-handed mode. The old trigger-release Pip-Boy open is disabled.
fPipboyPauseHoldSeconds = 0.35

; Keeps the pipboy-hand trigger's flashlight hold from firing while that hand
; is engaged in a ROCK interaction: holding an object, two-handing/supporting
; the equipped weapon, or carrying a part while the primary grip is detached.
; Raw OpenVR trigger state stays readable for consumer mods.
bSuppressPipboyGameInputWhileHolding = true

; Blocks the native Activate/WandAccept take-into-inventory or auto-equip outcome
; (A button on Quest 2) while the SAME hand whose wand is activating is holding a
; ROCK object. Generic Activate (open door, talk to NPC, search container, read
; note/terminal) keeps working on the same button - only takeable/equippable
; targets are suppressed, classified by the picked reference's form type below.
bSuppressTakeEquipGameInputWhileHolding = true

; Comma/space-separated list of form types treated as "take/equip" for the
; suppression above (matches TESForm::GetFormTypeString(), e.g. WEAP/ARMO/MISC).
; Targets whose form type is not in this list are never suppressed.
sSuppressTakeEquipFormTypes = WEAP,ARMO,AMMO,MISC,INGR,ALCH,BOOK,KEYM,SLGM

; Keeps a grab press alive briefly while selection, pull catch, or input suppression settles.
; This follows HIGGS' leeway/force input model but only feeds ROCK's internal grab edge.
bGrabInputIntentStateEnabled = true
fGrabInputLeewaySeconds = 0.12
fGrabInputForceSeconds = 0.08

; ============================================================================
; 3. Palm And Pointing Directions
; ============================================================================

; Palm normal is used by palm-facing grab, contact, API, and support behavior.
; Object selection aim is controlled by the fixed angle settings in section 12.
; These values are in ROCK hand space: X=fingers, Y=palm depth, Z=signed cross-palm.
fPalmNormalHandspaceX = 0.0
fPalmNormalHandspaceY = 1.0
fPalmNormalHandspaceZ = 0.0

; Legacy pointing vector used by parity diagnostics. Object selection aim is controlled in section 12.
fPointingVectorHandspaceX = 0.0
fPointingVectorHandspaceY = 1.0
fPointingVectorHandspaceZ = 0.0

; Flips the palm normal if palm-facing behavior is coming from the back of the hand.
bReversePalmNormal = true

; Flips the legacy pointing vector if parity diagnostics show it backward.
bReverseFarGrabNormal = true

; Legacy authored palm pivot used by API palm position, telemetry, debug tuning,
; two-handed grip, and non-dynamic helpers.
; Dynamic object grabs use the generated hidden proxy authority pivot below.
fRightGrabLegacyPalmPivotAHandspaceX = 6.0
fRightGrabLegacyPalmPivotAHandspaceY = -2.0
fRightGrabLegacyPalmPivotAHandspaceZ = 0.2
fLeftGrabLegacyPalmPivotAHandspaceX = 6.0
fLeftGrabLegacyPalmPivotAHandspaceY = -2.0
fLeftGrabLegacyPalmPivotAHandspaceZ = -0.2

; Local offset for the hidden grab authority proxy/seat point, in corrected palm proxy space.
; X follows the fingers, -Y moves into the palm face/skin, +Y moves to the back of the hand,
; and Z moves across the palm. This does not move the real palm/finger physics colliders.
fRightGrabAuthorityProxyOffsetXGameUnits = 0.0
fRightGrabAuthorityProxyOffsetYGameUnits = -1.5
fRightGrabAuthorityProxyOffsetZGameUnits = 0.0
fLeftGrabAuthorityProxyOffsetXGameUnits = 0.0
fLeftGrabAuthorityProxyOffsetYGameUnits = -1.5
fLeftGrabAuthorityProxyOffsetZGameUnits = 0.0

; Local offset for the CustomOGA frame, in CustomOGA local space.
; X follows the fingers, -Y moves into the palm face/skin, +Y moves to the back of the hand,
; and Z moves across the palm after the custom origin and raw-hand rotation are resolved.
fRightCustomOGAOffsetXGameUnits = 0.0
fRightCustomOGAOffsetYGameUnits = -2.0
fRightCustomOGAOffsetZGameUnits = 0.0
fLeftCustomOGAOffsetXGameUnits = 0.0
fLeftCustomOGAOffsetYGameUnits = -2.0
fLeftCustomOGAOffsetZGameUnits = 0.0

; ============================================================================
; 4. Weapon Collision And Support Grip
; ============================================================================

; Builds ROCK weapon collision hulls from the visible equipped weapon mesh.
; These hulls are used for hand contact, support grip, and weapon interaction evidence.
bWeaponCollisionEnabled = true

; Controls whether ROCK weapon hulls collide with projectile/spell layers.
; False avoids self-collisions with modded projectile systems while aiming.
bWeaponCollisionBlocksProjectiles = false
bWeaponCollisionBlocksSpells = false

; Allows generated weapon hulls to collide with static/animstatic world geometry for native contact evidence.
bWeaponCollisionStaticWorldEnabled = true

; Re-queues the current equipped weapon's native visual attach task when FO4VR leaves the first-person weapon tree one mod transaction behind.
bWeaponCollisionNativeVisualRemapEnabled = true

; Generated weapon collision mode.
; 3 = OptimizedTriShape: one generated source per visible, extractable TriShape after point dedupe and support fitting.
iWeaponCollisionGroupingMode = 3

; Frames ROCK waits for the visual weapon tree to stay visible/stable before replacing generated hulls after weapon/mod swaps.
iWeaponCollisionVisualStabilizationFrames = 8

; Convex hull skin radius and duplicate-point merge grid, in Havok meters.
; Increase only if hull generation is too thin or noisy.
fWeaponCollisionConvexRadius = 0.01
fWeaponCollisionPointDedupGrid = 0.002

; OptimizedTriShape support fitting keeps real mesh vertices that preserve the convex envelope.
iWeaponCollisionSupportFitTargetPoints = 96
fWeaponCollisionSupportFitMaxErrorGameUnits = 0.5

; Maximum speed allowed when ROCK keyframes generated weapon hulls.
fWeaponCollisionMaxLinearVelocity = 50.0
fWeaponCollisionMaxAngularVelocity = 100.0

; Rejects generated collision sources whose point cloud center sits further than
; the class-specific radius below from the weapon origin, in weapon-root local
; space. Guards against misplaced/detached attachment geometry (commonly laser
; and holosight NiNodes authored off-mesh) that would otherwise generate a valid
; but wrongly-placed collider far from the actual gun.
bWeaponCollisionMaxSourceDistanceEnabled = true

; Weapon size class is resolved from item weight (weaponData.weight /
; instance weight), since the game's weapon-type data does not distinguish
; pistol/rifle/heavy. Melee weapons are detected directly and always use the
; melee radius regardless of weight.
; Weight <= fWeaponSizeClassPistolMaxWeight -> Pistol
; fWeaponSizeClassPistolMaxWeight < weight <= fWeaponSizeClassRifleMaxWeight -> Rifle
; weight > fWeaponSizeClassRifleMaxWeight -> Heavy
fWeaponSizeClassPistolMaxWeight = 6.0
fWeaponSizeClassRifleMaxWeight = 20.0

; Max generated-source distance from weapon origin, in game units, per size class.
fWeaponCollisionMaxSourceDistanceMelee = 90.0
fWeaponCollisionMaxSourceDistancePistol = 20.0
fWeaponCollisionMaxSourceDistanceRifle = 45.0
fWeaponCollisionMaxSourceDistanceHeavy = 70.0

; Small surface-vicinity radius around each configured legacy palm pivot.
; Physical contact uses it to decide whether the live palm reached an authored
; seat, and every authored support seat must also be this close to the current
; generated weapon mesh. An off-weapon authored seat uses ROCK's dynamic seat.
fWeaponInteractionTouchRadius = 2.0

; Broader per-hand search used when the palm is not touching the weapon.
; With authored weapon grips enabled, a grab acquired only by this probe may
; use the modeler's authored support seat only when the surface check above
; confirms that seat belongs to the current weapon.
fWeaponInteractionProbeRadius = 12.0

; Every support grab inside this distance from the firing grip stays visual-only
; so pistols retain a stable support pose without competing weapon authority.
; ROCK always owns this behavior. An active equipped-weapon addon may override
; only the radius through the ROCK V1 API. Game units (~1.4cm each).
fFiringGripProximitySupportRadius = 6.0

; Eases equipped-weapon support acquisition. Normal dynamic full-authority grabs
; share this timing across support steering and both hand roots; authored,
; provider-owned, AttachOnly, and visual-only grabs retain their existing paths.
bWeaponSupportGripHandLerpEnabled = true
fWeaponSupportGripHandLerpTimeMin = 0.12
fWeaponSupportGripHandLerpTimeMax = 0.20
fWeaponSupportGripHandLerpMinDistance = 1.0
fWeaponSupportGripHandLerpMaxDistance = 14.0

; Smooths released equipped-weapon hands and ROCK-driven weapon poses back to native tracking.
; Duration uses the larger of the translation and shortest-arc rotation mappings.
bWeaponVisualReturnEnabled = true
fWeaponVisualReturnTimeMin = 0.12
fWeaponVisualReturnTimeMax = 0.20
fWeaponVisualReturnMinDistance = 1.0
fWeaponVisualReturnMaxDistance = 14.0
fWeaponVisualReturnMinAngleDegrees = 5.0
fWeaponVisualReturnMaxAngleDegrees = 90.0

; ============================================================================
; 5. Dynamic Hand World Collision
; ============================================================================

; Real Havok world collision for palm/fingertip dynamic proxies.
bHandCollisionDynamicDrive = true
fHandCollisionDynamicMaxLinearVelocityHavok = 15.0
fHandCollisionDynamicContactPressMaxVelocityHavok = 1.0
fHandCollisionDynamicDivergenceTeleportGameUnits = 40.0
fHandCollisionDynamicDivergenceTeleportDwellSeconds = 0.3
fHandCollisionDynamicTeleportRecoverySeconds = 0.25
fHandCollisionDynamicRenderFollowMinDeviationGameUnits = 0.05
fHandCollisionDynamicRenderFollowSmoothingSpeed = 45.0
iHandCollisionDynamicVisualPriority = 80

; One speed-scaled pulse per hand when real dynamic world contact begins.
bHandCollisionDynamicHapticsEnabled = true
fHandCollisionDynamicHapticDurationSeconds = 0.035
fHandCollisionDynamicHapticBaseIntensity = 0.18
fHandCollisionDynamicHapticMaxIntensity = 0.55
fHandCollisionDynamicHapticSpeedScale = 0.006
fHandCollisionDynamicHapticMinApproachSpeedGameUnitsPerSecond = 3.0
fHandCollisionDynamicHapticCooldownSeconds = 0.12

; ============================================================================
; 6. Native Melee Suppression
; ============================================================================

; Stops Fallout VR's animation-timed player melee hits so ROCK can own physical melee timing.
; NPC melee and non-player animation handlers still pass through.
bNativeMeleeSuppressionEnabled = true

; Stronger suppression for player melee hitframes and weapon-swing handling.
; Keep enabled to avoid stacking vanilla melee hits on top of ROCK physical contacts.
bNativeMeleeFullSuppression = true
bNativeMeleeSuppressWeaponSwing = true
bNativeMeleeSuppressHitFrame = true

; Extra log spam for native melee suppression decisions.
bNativeMeleeDebugLogging = false

; Filters only the native player character-controller bubble contacts.
; Keeps world/support blocker layers, but prevents the vanilla bubble from pushing clutter, guns, actors, ragdolls, and ROCK-generated bodies.
bNativeCharacterControllerObjectContactFilterEnabled = true

; ============================================================================
; 7. Selection Feedback
; ============================================================================

; Highlights the object ROCK thinks your hand can grab.
bHighlightEnabled = true
; ROCK-owned grab highlight intensity: 1=40%, 2=60%, 3=80%, 4=100%.
iHighlightIntensityMode = 3
; ROCK-owned grab highlight color: red, blue, orange, or white.
sHighlightColor = orange

bSelectionBeamEnabled = true
; ============================================================================
; 8. Debug Overlay: What To Draw
; ============================================================================

; Draws live ROCK Havok bodies from their real hknp shapes.
bDebugShowColliders = false

; Also draws the selected or held target body for hand-vs-object comparison.
bDebugShowTargetColliders = false

; Draws live transform axes. Red=X, green=Y, blue=Z.
bDebugShowHandAxes = false

; Draws grab constraint pivots and the error line between hand-side and object-side pivots.
bDebugShowGrabPivots = false

; ----------------------------------------------------------------------------
; NEW SWEPT-ARC FINGER SOLVER VISUALIZATION
; This is independent of bDebugShowGrabFingerProbes (the legacy straight/pad
; probe overlay). It reads the one-shot swept solve captured at grab time and
; never re-runs mesh queries. Pinch intentionally remains on its separate path.
; Cyan=Tip arc, green=Outer arc, purple=Inner arc, yellow=selected contact
; sphere, white=hit normal/live finger skeleton. Red/magenta/blue/orange mark
; miss fallback, close-limit hit, out-of-reach, and over-open respectively.
bDebugShowGrabFingerSweptArc = false
; Adds per-finger state/value/probe/lane labels and BVH work totals.
bDebugShowGrabFingerSweptArcText = true
; Draws the current rendered finger chains for direct comparison with the arcs.
bDebugShowGrabFingerSweptArcLiveSkeleton = true

; LEGACY ONLY: draws the former straight and pad probes. It is unrelated to the
; swept-arc visualization above.
bDebugShowGrabFingerProbes = false

; Draws the resolved mesh surface frame after a dynamic grab.
bDebugShowGrabPocketNormal = false

; Draws accepted contact-patch points used to fit the grab surface.
bDebugDrawGrabContactPatch = false

; Draws a focused held-grab pivot force/lever view: target pivot, live pivot, correction vector, lever arm, and torque witness.
bDebugDrawGrabForceTorque = false

; Adds a compact world label to the focused grab force/lever view.
bDebugDrawGrabForceTorqueText = false

; Draws the hknp body/collider that owns the frozen object-side pivot B.
bDebugDrawGrabPivotSourceCollider = false

; Draws the mesh triangle/contact-patch evidence that produced the frozen pivot.
bDebugDrawGrabPivotSourceEvidence = false

; Draws the frozen grab support face frame at pivot B: normal, support axis, and binormal.
bDebugDrawGrabSupportFrame = false

; Draws the live palm pocket and thumb/index pinch pocket for each hand.
bDebugDrawGrabPockets = true

; Draws palm center plus close/far selection aim rays.
bDebugShowPalmVectors = false

; More specific overlay filters and draw limits.
bDebugDrawHandColliders = false
bDebugDrawHandBoneColliders = false
bDebugDrawDynamicHandColliders = false
bDebugDrawHandBoneContacts = false
iDebugMaxHandBoneBodiesDrawn = 48
iDebugMaxBodyBoneBodiesDrawn = 32
bDebugDrawWeaponColliders = false
; Native-scope diagnosis: sight bounds, live camera, exact pre-activation target pose/aim/up guides, write readback, parent/local camera, and HMD guides.
bDebugDrawNativeScopeActivation = false
; Reserved for the dynamic weapon collider prototype; currently inert.
bDebugDrawDynamicWeaponColliders = false

; Logs first-person Weapon/WeaponLeft/AnimObject/Projectile anchors, transforms, child names, and subtree mesh counts.
; Useful for investigating equipped weapon mod swaps that expose geometry outside ROCK's current collision roots.
bDebugDumpWeaponAnimNodes = false
iDebugMaxWeaponBodiesDrawn = 100
iDebugWeaponAnimNodeDumpIntervalFrames = 120
; Bounded overlay work and memory budgets. Zero disables the corresponding capture/upload/draw stream where noted.
; Ranges: captures 0..32, compound slots 1..1024, depth 1..8, queued/completed 0..256,
; uploads 0..16, cache entries 16..4096, cache bytes 1048576..536870912,
; body instances 0..171, line vertices 0..65536, text vertices 0..131072.
iDebugMaxShapeCapturesPerFrame = 32
iDebugMaxConvexSupportVertices = 8
iDebugMaxCompoundChildren = 256
iDebugMaxCompoundDepth = 4
iDebugMaxShapeQueuedJobs = 64
iDebugMaxShapeCompletedJobs = 64
iDebugMaxShapeUploadsPerFrame = 2
iDebugMaxShapeCacheEntries = 512
iDebugMaxShapeCacheBytes = 67108864
iDebugMaxBodyInstances = 171
iDebugMaxLineVertices = 8192
iDebugMaxTextVertices = 131072
bDebugUseBoundsForHeavyConvex = true

; ============================================================================
; 9. Debug Logs, Telemetry, And Notifications
; ============================================================================

; Very noisy per-frame diagnostic logging. Use only while investigating a specific issue.
bDebugVerboseLogging = false

; Focused logs for grab frame capture and held-object transform comparisons.
bDebugGrabFrameLogging = false
; FINGER-CYCLE adoption trace: logs every held finger pose adoption with
; anchor hints, contact rotations, and the hand-relative object position
; (discriminates chain-feedback cycling from the object moving in hand).
bDebugGrabFingerPoseLogging = false

; Structured per-grab timeline rows for capture, constraint writes, solver response, and release.
; Use this when building graphs from ROCK.log. Very noisy when enabled.
bDebugGrabTimelineTrace = false
iDebugGrabTimelineTraceIntervalFrames = 1

; Sample after-solve proxy/body mismatch diagnostics without enabling full grab-frame logging.
; This reads live body and constraint atom state; keep disabled during normal gameplay.
bDebugGrabAfterSolveAnomalySampling = false

; Timestamp-matched grab telemetry for comparing video, overlay text, and ROCK.log rows.
bDebugGrabTransformTelemetry = false
bDebugGrabTransformTelemetryText = false
bDebugGrabTransformTelemetryAxes = false
iDebugGrabTransformTelemetryLogIntervalFrames = 1

; 0 = duplicate telemetry text into both VR eye halves.
; 1 = draw one text panel across the submitted texture.
iDebugGrabTransformTelemetryTextMode = 0

; In-game popup diagnostics for grab decisions.
bDebugShowGrabNotifications = false

; In-game popup diagnostics for weapon contact and support grip decisions.
bDebugShowWeaponNotifications = false

; One-shot research dump per equipped weapon build: installed OMOD records
; (attach point, model path), generated evidence bindings, and the assembled
; weapon node tree. Verbose; enable only when collecting part-identity data.
bDebugWeaponOmodDump = false

; Periodic post-build coverage audit: re-diffs installed OMOD records against
; the live scene graphs and the active collider set while weapon bodies exist,
; reporting per-OMOD verdicts and visual-key drift. Catches part models the
; engine attaches after ROCK's build window closed. Verbose; research only.
bDebugWeaponOmodCoverageAudit = false
iDebugWeaponOmodCoverageAuditIntervalFrames = 450

; Reattaches installed OMOD models the coverage audit reports as NODE_NOT_FOUND
; using the engine's own connect-point attach (BGSMod TryAttach3DRecurse),
; then rebuilds weapon colliders. Research prototype; requires
; bDebugWeaponOmodCoverageAudit. One attempt per assembled weapon instance.
bDebugWeaponOmodSelfHeal = false

; One-shot engine weapon reattach ~1s after a workbench menu closes, to
; recover the rendered weapon copy the engine's post-workbench actor reset
; can leave invisible. Fires the same attach the WeaponAttach anim event
; uses. Research prototype.
bDebugWorkbenchWeaponReattach = false
; Compares ROCK's direct first-person skeleton hand transforms against the FRIK API path.
; Diagnostic only. It does not choose the active hand frame.
bDebugHandTransformParity = false

; Logs and draws alternate world-origin candidates for selected or held objects.
; Diagnostic only. It does not change object motion.
bDebugWorldObjectOriginDiagnostics = false
iDebugWorldObjectOriginLogIntervalFrames = 30
fDebugWorldObjectOriginMismatchWarnGameUnits = 5.0

; ============================================================================
; 10. Skeleton Debug
; ============================================================================

; Draws markers and axes for live first-person skeleton bones.
bDebugShowRootFlattenedFingerSkeletonMarkers = false
bDebugShowSkeletonBoneVisualizer = false
; Draws a triad at the custom collider-origin frame derived from hand position, finger bases, and palm-depth axes.
customcalibrationoffset = false

; 0 = minimal/core bones, 1 = core body and fingers, higher modes may draw more if supported.
iDebugSkeletonBoneMode = 1

; Selects the skeleton source used by the debug visualizer.
iDebugSkeletonBoneSource = 1

; Draw limits and filters for skeleton debug drawing.
iDebugMaxSkeletonBonesDrawn = 256
bDebugDrawSkeletonBoneAxes = false
iDebugMaxSkeletonBoneAxesDrawn = 80
sDebugSkeletonAxisBoneFilter = 

; Logs bone names and truncation information to ROCK.log.
bDebugLogSkeletonBones = false
