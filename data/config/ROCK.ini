; Fixed selection aim angles, in degrees. Valid values: 0, 20, 45, 75, 90.
; 0 points along Palm; 90 points along Fingers.
iCloseSelectionAngleDegrees = 0
iFarSelectionAngleDegrees = 0

; Far selection follows its configured hand angle, but the hit must also be inside the HMD view cone.
bFarSelectionHmdConeEnabled = true
fFarSelectionHmdConeHalfAngleDegrees = 50.0
