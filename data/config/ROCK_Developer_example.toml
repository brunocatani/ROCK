## Draws palm center plus close/far selection aim rays.
DebugShowPalmVectors = false

## More specific overlay filters and draw limits.
DebugDrawHandColliders = false

DebugDrawHandBoneColliders = false

DebugDrawBodyBoneColliders = false

DebugDrawDynamicHandColliders = false

DebugDrawHandBoneContacts = false

