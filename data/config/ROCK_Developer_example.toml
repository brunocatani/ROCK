## === 18. Physics Timing ===
[PhysicsTiming]
## Stabilizes FO4VR physics timing when rendering falls below the reference rate.
HavokTimingFixEnabled = true

## VATS Physics Fixes
## Preserves equipped-weapon handling speed during VATS and other game slow motion.
## Compensates the weapon drive and constraint while keeping dynamic collision.
## Changes apply at the next physics step; false restores uncompensated handling.
VatsPhysicsFixes = true

HavokTimingFixMinPhysicsFrameRate = 70.0

HavokTimingFixMaxSubsteps = 3

## === 19. Scope Placement ===
[ScopePlacement]
## Scope Fallback Anchor
## When a weapon has no usable generated Scope or Sight geometry, the scope anchors at the firing grip, moved by these values.
## Offsets are game units (70 = 1 metre) in the weapon's axes: X sideways, +Y toward the muzzle, Z up; all zero puts the anchor on the firing grip.
## Rotations are degrees added after the game's camera calibration: pitch about X, yaw about Z, roll about the muzzle axis.
## Position moves the activation point, camera and overlay together; rotation corrects the camera and overlay only.
## This key: offset [x, y, z]. Each value: -100 to 100.
NativeScopeFiringGripFallbackOffsetGameUnits = [0.0, 0.0, 10.0]

## Scope fallback rotation [pitch, yaw, roll], in degrees. Each value: -180 to 180.
NativeScopeFiringGripFallbackRotationDegrees = [0.0, 0.0, 0.0]

## Scope Overlay
## Fine-tunes only the game's own world_scope.nif overlay. The activation camera stays on the resolved sight or firing-grip anchor, so these values do not change when the scope activates.
## All zero keeps automatic placement with the game's own model orientation and scale.
## Offsets are game units in the calibrated model frame; rotations are degrees: pitch about X, yaw about Z, roll about the optical Y axis.
## Tune one axis at a time; replacement scope meshes can use a reversed sign.
## This key: offset [x, y, z]. Each value: -100 to 100.
NativeScopeOverlayOffsetGameUnits = [0.0, 10.0, 0.0]

## Scope overlay rotation [pitch, yaw, roll], in degrees. Each value: -180 to 180.
NativeScopeOverlayRotationDegrees = [0.0, 0.0, 0.0]
