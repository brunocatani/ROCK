## Native-scope diagnosis: sight bounds, live camera, exact pre-activation target pose/aim/up guides, write readback, parent/local camera, and HMD guides.
DebugDrawNativeScopeActivation = false

## Visualizes the topology-specific authored cone/arc, live approach vector, and
## optional palm/fingertip collision witnesses. Witnesses are diagnostic only.
## Also draws the firing-grip reattach zone and live palm vectors during part carry.
DebugDrawAuthoredGripActivationZones = false

## Draws two-handed weapon/hand/FRIK authority frames and mismatch evidence.
DebugDrawWeaponAuthority = false

## Compare both tracked wand frames, reference aim (cyan), configured aim (gold), damped aim (purple) and final barrel (green). The reference basis is a model, not physical ground truth. Does not change aiming.
DebugDrawControllerAim = false

## Gunstock measurements: exact tracked controller origins/axes, controller baseline, weapon forward and authored hand seats. Each support grab marks a sample. Does not change aiming.
DebugDrawGunstock = false

## Draws the loose-weapon projected grip point, palm relation, and equip radius state.
DebugDrawLooseWeaponGripZones = false

## Draws the layer-51 dynamic weapon compound proxy and contact/correction telemetry.
DebugDrawDynamicWeaponColliders = false

DebugMaxWeaponBodiesDrawn = 100

## Bounded overlay work and memory budgets. Zero disables the corresponding capture/upload/draw stream where noted.
## Ranges: captures 0..32, compound slots 1..1024, depth 1..8, queued/completed 0..256,
## uploads 0..16, cache entries 16..4096, cache bytes 1048576..536870912,
## body instances 0..195, line vertices 0..65536, text vertices 0..131072.
DebugMaxShapeCapturesPerFrame = 32

DebugMaxConvexSupportVertices = 8

DebugMaxCompoundChildren = 256

DebugMaxCompoundDepth = 4

DebugMaxShapeQueuedJobs = 64

DebugMaxShapeCompletedJobs = 64

DebugMaxShapeUploadsPerFrame = 2

DebugMaxShapeCacheEntries = 512

DebugMaxShapeCacheBytes = 67108864

DebugMaxBodyInstances = 163

DebugMaxLineVertices = 8192

DebugUseBoundsForHeavyConvex = true

## === 16. Logs and Telemetry ===
[LogsAndTelemetry]
