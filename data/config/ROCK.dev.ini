bPullCatchWideReacquireEnabled = true
fPullCatchWideReacquireRadiusGameUnits = 32.0
fPullCatchWideReacquireMaxBodyDistanceGameUnits = 42.0
fPulledAngularDamping = 8.0

; Far grabs pull the object's CENTER to the hand instead of the ray-hit point
; (a hit at selection range is aim noise, not grip intent). The arrival seat
; then settles the surface onto the palm via the seat machinery.
bPullToObjectCenterEnabled = true

; Long-object presentation during pull flight: rotates elongated props (brooms,
; bottles) so their mesh long axis lines up with the hand's thumb->pinky line
; before arrival. Flight-only; held objects are never rotated. Elongation is the
; RMS extent ratio between the mesh's dominant and second axis (compact objects
; ~1 skip presentation). Gain is proportional rad/s per rad of error.
bPullLongAxisPresentationEnabled = true
fPullPresentationMinElongationRatio = 2.0
fPullPresentationAngularGainPerSecond = 6.0
fPullPresentationMaxAngularSpeedRadiansPerSecond = 8.0
; Tilts the presentation target off pure cross-palm Z toward the fingers-forward
; X axis, in degrees (-45..45): the thumb occupies the pure-Z line, so the
; natural long-object hold sits a few degrees toward X. Applies to both the
; pull-flight servo and the force-grab seat alignment.
; PER HAND: the value is applied with the RIGHT hand's sign and mirrored for the
; left. Cross-palm comes from the non-mirrored authored handspace convention, so
; authored +Z is thumbward on one hand and pinkyward on the other - one shared
; signed value would tilt toward the fingers on one hand and away on the other.
; Measured from 59 user-verified holds (2026-07-25): right-hand rods sit at
; +34 deg in this convention (IQR +23..+45), left-hand rods at -29 deg.
fPullPresentationGripAxisTiltDegrees = 0.0

; Force grabs (grenade menu, provider API) commit without a pull flight, so
; elongated objects get the same long-axis alignment applied to the SEAT pose
; instead (rotation about the grip point at commit). Uses the elongation gate
; above. Replaces the retired hardcoded grenade/Molotov calibrations.
bForceGrabSeatAlignmentEnabled = true

; Face-to-palm roll applied to the SEAT pose at commit for every programmatic
; arrival (pull-catch and force grab): a minimal-arc swing leaves arrival roll
; untouched, so a tilted flat face could cut diagonally into the palm. ROD and
; PLANK shapes twist about their long axis so the thinnest extent faces the
; palm; the ratio gates on sqrt(lambda2/lambda3) of the mesh PCA (1..10), and
; round cross sections (~1, pipes/bottles) skip because any roll is equivalent.
; PLATES ARE DELIBERATELY EXCLUDED: 31 user-verified plate holds (2026-07-25)
; put the face normal 63 deg off the palm normal (IQR 57..72) because plates
; are held by an edge or corner. Aligning their face to the palm fought the
; intended grip, so that branch was removed rather than retuned.
bGrabSeatRollAlignmentEnabled = true
fGrabSeatRollMinSecondElongationRatio = 1.25

; Maximum scene-node depth used when scanning an object for physics bodies.
iObjectPhysicsTreeMaxDepth = 12

; Lets moving hands or weapon hulls nudge already-dynamic props.
; It never converts static or keyframed objects into dynamic objects.
bDynamicPushAssistEnabled = true
