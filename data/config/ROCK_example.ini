; ROCK_example.ini - every player option with its default and help
; Reference only: ROCK never reads this file. The first time ROCK starts it writes this same text as
; ROCK.ini in Documents\My Games\Fallout4VR\Mods_Config\ROCK.


[Logging]

; === 01. Logging ===
; How much ROCK writes to ROCK.log.
; 0 = Trace. 1 = Debug. 2 = Info. 3 = Warn. 4 = Error. 5 = Critical. 6 = Off.
; Trace and Debug write a lot and can cost frame time; keep Info for normal play.
iLogLevel = 2


[Grenades]

; === 02. Grenades ===
; Immersive Grenades
; Hold the grenade button (right B by default) to draw a grenade into your hand and throw it by hand.
; Selecting a grenade in PALM also puts it in your hand.
; False: the game's own hold and release throw.
; Release the grenade button before changing this; a grenade already drawn keeps its mode.
bImmersiveGrenades = true

; Grenade Fuse
; Seconds from pulling the pin to detonation for grenades drawn by hand.
; 0 uses the grenade's own fuse time. Range: 0 to 30.
fRealisticGrenadeFuseSeconds = 4


[ImmersiveAid]

; === 03. Immersive Aid ===
; Immersive Aid
; Stimpaks and Med-X sit in a fixed syringe grip and inject after touching your body for 0.5 seconds.
; False: they are grabbed like any object and used by bringing them to your mouth.
; Release and grab again to see the change on an item already in your hand.
bEnabled = true


[ImmersiveWeapons]

; === 04. Weapon Handling ===
; Gunstock Mode
; Two-handed firearms aim along the line from your firing hand to your support hand, like a rifle with a stock.
; Hand and finger poses stay as authored; the support hand may sit slightly away from its controller.
; Melee weapons, weapon parts you operate and bipod-latched weapons are not affected.
; False: normal two-hand aiming.
bGunstockMode = false

; FRIK Weapon Offsets
; Use the weapon offset files you saved in FRIK (FRIK_Config\Weapons_Offsets), including their weapon scale, instead of ROCK's grip.
; FRIK's built-in default offsets are never used.
; Weapons with a saved file use dynamic support grabs only and skip PAPER's reload and cycle animations.
bFrikUserWeaponOffsets = false

; Bipod Mode
; Click the right stick to latch any equipped weapon part to the surface it touches.
; While latched, recoil is a fixed 10% whatever your hands or armor.
; False: the click is left to other mods.
bBipodMode = true

; Bipod Hands-Free Distance
; A latched weapon stays equipped with no hand on it while your headset is within this distance of the latch point, in metres.
; Farther away it is left in place as a world object (it does not fall). Must be above 0.
fBipodHandsFreeRadiusMeters = 2

; Detach Either Hand
; Either hand may let go of the weapon, including the hand on the firing grip; the other hand keeps holding it.
; Grips release as Weapon Grab Mode sets. Parts you only attach to release when you let go of the button.
; What happens when the last hand lets go is set by Weapon Equip Mode.
bDetachEitherHand = true

; Weapon Equip Mode
; 1 = Trigger Equip with no drop (game default). 2 = Trigger Equip with Toggle Drop.
; 3 = Trigger Equip with Auto Drop. 4 = Auto Equip (always Auto Drop).
; Trigger Equip: pull the trigger while holding a loose weapon to equip it in that hand.
; When the last hand lets go of an equipped weapon:
; mode 1 keeps it equipped and held;
; mode 2 unequips it into a loose weapon held in that hand: press grab again and release to drop or stash it, or pull the trigger to equip it again;
; mode 3 drops it in place, with the same release rules but no forced grab.
; Mode 4 equips a loose weapon once your palm settles on its firing grip (see Auto Equip Settle Time), without the trigger.
; Far grabs seat a loose weapon at its firing grip and close grabs at its nearest grip; touch grabs equip only inside a grip zone.
; With a weapon already in the other hand, the new one becomes the second weapon.
; Applies per weapon. Weapon Grab Mode sets the release gesture in every mode.
iWeaponEquipMode = 2

; Weapon Grab Mode
; 1 = Toggle both grips. 2 = Toggle firing grip only. 3 = Hold both grips.
; Toggle: press grab to take the grip and press again to let go. Hold: the grip lasts while you hold grab.
; Mode 2 toggles whichever hand holds the firing grip; support grips must be held.
; Parts you only attach to always need grab held. Ordinary objects and surfaces always use hold to grab.
; Weapon Equip Mode decides whether the last release keeps a loose grab or drops the weapon.
iWeaponGrabMode = 1

; Auto Equip Settle Time
; Seconds your palm must stay on the firing grip before Auto Equip (Weapon Equip Mode 4) equips. Range: 0 to 2.
fAutoEquipSettleSeconds = 0.15

; Grab Anywhere on Weapon
; True: your support hand can hold a firearm anywhere.
; False: firearms with authored support grips take the support hand only there (default).
; Melee weapons, and firearms without an authored support grip, can always be held anywhere.
; Applies to either support hand.
bGrabAnywhereOnWeapon = false

; Melee Grip Angle
; Tilts a held melee weapon and your hand together around the grip, in degrees, on top of ROCK's built-in 30 degree forward tilt.
; Positive tilts further forward, negative tilts back; -30 gives the weapon's authored angle. Range: -180 to 180.
; Regrab a loose weapon to see the change.
fMeleeGripPitchDegrees = 0

; Shake Filtering
; 0 = Off. 1 = Responsive. 2 = Balanced. 3 = Steady. 4 = Heavy.
; Smooths controller shake on equipped firearms, loose weapons and held objects. Higher steadies more but responds more slowly.
; Rotation and position smoothing: Responsive 12 and 6 ms, Balanced 25 and 12 ms, Steady 45 and 22 ms, Heavy 70 and 35 ms.
; Free hands, FRIK and recoil are not affected. Applies at once.
iWeaponFilteringPreset = 0

; Shake Filtering: Follow Head
; On: Shake Filtering smooths the controllers' motion relative to your head's position, so moving your body passes through unsmoothed, like stick movement.
; Moving only your head briefly carries the weapon a little with it. Rotation smoothing is unchanged.
; Off: smoothing relative to the play space. Applies at once.
bShakeFilterFollowsHead = false

; Scoped Filtering: Rotation
; Extra rotation smoothing, in seconds, while you look through a scope, with or without Shake Filtering.
; 0 here and in Scoped Filtering: Position turns scoped filtering off. Range: 0 to 1.
fScopedFilterRotationSeconds = 0.15

; Scoped Filtering: Position
; Extra position smoothing, in seconds, while you look through a scope. Range: 0 to 1.
fScopedFilterTranslationSeconds = 0.08

; Scoped Filtering: Release Speed
; How fast you turn the controller, in degrees per second, before the scoped smoothing drops to half.
; Holding still gets full smoothing; swinging to a new target loosens it.
; 0 keeps full smoothing at any speed. Range: 0 to 720.
fScopedFilterReleaseDegreesPerSecond = 45

; Firing Grip Reach
; How far from the firing grip a hand can take it over or grab it again, in game units (70 = 1 metre).
; The zone is a quarter circle on each side of the grip, from straight out to straight down.
; Press grab inside it to move the firing grip to that hand; the firing hand can also pass it with a grab tap. Range: 0.25 to 30.
fFiringGripReattachRadiusGameUnits = 10

; Grip Zone Marker Size
; Diameter of the sphere that marks a weapon's grip zones, in game units (70 = 1 metre). Range: 0.1 to 5.
fGripZoneIndicatorDiameterGameUnits = 0.7

; Ammo Counter Style
; 1 = Minimal. 2 = Immersive. 3 = Vanilla.
; Minimal: white loaded and reserve rounds beside the firing grip on the palm side, shown while you look at them.
; Immersive: the same place and look to show, in the game's HUD color and bracket frame, loaded over reserve.
; Vanilla: the game's counter on the back of the hand holding the weapon, in HUD color, always shown (mirrored on the left hand).
; Every style replaces the game's counter with one counter per drawn weapon. The counters are drawn through RPS UI Framework.
iAmmoCounterStyle = 1


[Recoil]

; === 05. Weapon Recoil ===
; Immersive Recoil
; Uses the recoil strengths below, for either hand and in power armor.
; False: the game's own recoil strength, on the hand that fires.
; The developer setting Emergency Disable Recoil overrides both.
bImmersiveRecoil = true

; Laser Recoil
; Recoil for laser weapons in any hold and in power armor: 100 = 10% of the game's movement and rotation, 0 = none. Range: 0 to 300.
; A bipod-latched weapon keeps its fixed 10%.
fLaserRecoilPercent = 100

; Recoil Strength by Weapon Type
; Percent of each weapon type's recoil: 0 = none, 100 = full, 300 = triple. Range: 0 to 300.
; One Hand applies without a support grip, Two Hand with one.
; Bipod latching and power armor use their own fixed recoil.
; This key: pistols held with one hand.
fPistolOneHandRecoilPercent = 300

; Pistols held with two hands. Range: 0 to 300.
fPistolTwoHandRecoilPercent = 80

; Rifles held with one hand. Range: 0 to 300.
fRifleOneHandRecoilPercent = 300

; Rifles held with two hands. Range: 0 to 300.
fRifleTwoHandRecoilPercent = 80

; Shotguns held with one hand. Range: 0 to 300.
fShotgunOneHandRecoilPercent = 300

; Shotguns held with two hands. Range: 0 to 300.
fShotgunTwoHandRecoilPercent = 80

; Heavy weapons held with one hand. Range: 0 to 300.
fHeavyOneHandRecoilPercent = 300

; Heavy weapons held with two hands. Range: 0 to 300.
fHeavyTwoHandRecoilPercent = 300

; Any other firearm held with one hand. Range: 0 to 300.
fDefaultOneHandRecoilPercent = 300

; Any other firearm held with two hands. Range: 0 to 300.
fDefaultTwoHandRecoilPercent = 80


[Grabbing]

; === 06. Grabbing ===
; Far Grab Mode
; 1 = Immediate Pull. 2 = Higgs Pull Mode.
; Immediate Pull: grabbing a far object pulls it to your hand and catches it, with no flick.
; Higgs Pull Mode: hold grab to lock on, flick your hand toward yourself, then keep holding to pull the object in and catch it.
; Release before the flick or during the pull to cancel. Applies to the next far grab.
iFarGrabMode = 1

; Which way your hand reaches for nearby objects.
; 0 = Out of the palm. 20 = Mostly out of the palm. 45 = Between palm and fingers. 75 = Mostly along the fingers. 90 = Along the fingers.
; The number is the angle in degrees from the palm toward the fingers. Applies at once, on each hand.
iCloseGrabDirection = 0

; Which way your hand points to aim far grabs.
; 0 = Out of the palm. 20 = Mostly out of the palm. 45 = Between palm and fingers. 75 = Mostly along the fingers. 90 = Along the fingers.
; The number is the angle in degrees from the palm toward the fingers. The object must also be in your view. Applies at once, on each hand.
iFarGrabDirection = 0

; Loot to Hand
; True: an item taken with the quick-loot view (pointing at a container) lands in that hand.
; The full container menu keeps sending items to inventory. A busy hand passes the item to the other free hand; with no free hand it stays in inventory.
; False: taken items go to inventory (game default).
bLootToHand = true


[FiringHand]

; === 07. Firing Hand ===
; Default Hand
; right or left: the firing hand for equips that come without a hand (favorites, PALM, scripts and other mods).
; Grenade draws prefer this hand and use the other one when it is busy.
; Pip-Boy and trigger equips and grip handoffs always use the hand that acts.
; Applies on the next equip or draw. The game's own left-handed mode is not supported and stays off.
sDefaultHand = right

; Left Firing Aim: Yaw
; Turns the aim of a weapon fired from the left hand, in degrees. 0 uses the plain mirror of the right-hand hold. Range: -30 to 30.
fLeftFiringAimYawDegrees = 0

; Left Firing Aim: Pitch
; Tilts the aim of a weapon fired from the left hand up or down, in degrees. Range: -30 to 30.
fLeftFiringAimPitchDegrees = 0

; Left Firing Aim: Offset X
; Shifts the aim of a weapon fired from the left hand, in game units (70 = 1 metre). Range: -15 to 15.
fLeftFiringAimOffsetXGameUnits = 0

; Left Firing Aim: Offset Y
; Shifts the aim of a weapon fired from the left hand, in game units. Range: -15 to 15.
fLeftFiringAimOffsetYGameUnits = 0

; Left Firing Aim: Offset Z
; Shifts the aim of a weapon fired from the left hand, in game units. Range: -15 to 15.
fLeftFiringAimOffsetZGameUnits = 0

; Left Firing Grip: Along Fingers
; Moves where the left hand holds the firing grip, along the fingers, in game units (70 = 1 metre).
; 0 = the plain mirror of the right-hand grip. The hand stays put and the weapon moves the other way. Range: -15 to 15. Regrab to apply.
fLeftFiringGripOffsetXGameUnits = 0

; Left Firing Grip: Palm Depth
; Moves the left firing grip into or out of the palm, in game units. Range: -15 to 15. Regrab to apply.
fLeftFiringGripOffsetYGameUnits = 0

; Left Firing Grip: Across Palm
; Moves the left firing grip across the palm, in game units. Range: -15 to 15. Regrab to apply.
fLeftFiringGripOffsetZGameUnits = 0

; Right Support Grip: Along Fingers
; Moves where the right hand holds a support grip when the left hand fires, along the fingers, in game units (70 = 1 metre).
; 0 = the plain mirror of the left-hand support grip. Range: -15 to 15. Regrab to apply.
fRightSupportGripOffsetXGameUnits = 0

; Right Support Grip: Palm Depth
; Moves the mirrored right support grip into or out of the palm, in game units. Range: -15 to 15. Regrab to apply.
fRightSupportGripOffsetYGameUnits = 0

; Right Support Grip: Across Palm
; Moves the mirrored right support grip across the palm, in game units. Range: -15 to 15. Regrab to apply.
fRightSupportGripOffsetZGameUnits = 0


[NativeScopes]

; === 08. Scopes ===
; Immersive Scopes
; ROCK places the scope view on the weapon, raises it while you hold the scope button (right A by default), and corrects the overlay and zoom.
; False: the game's own scopes.
; Starting with this off leaves the game's scope hook free for other scope mods. Turning it on takes the hook until you restart; if another mod owns it, ROCK's scopes stay off.
; Release the scope button before changing this. Reload stays on a tap of the same button.
bEnableImmersiveScopes = true

; Scope Hold Time
; Seconds to hold the scope button (right A, or left X for a left firing hand) before the scope view comes up; a shorter press reloads. Range: 0.05 to 2.
fManualScopeHoldSeconds = 0.3


[Controls]

; === 09. Controller Input ===
; Button Layout
; The physical input that acts as each ROCK button, per hand. ROCK, PALM, PAPER, SCISSORS Redux, FRIK and the game all follow it.
; The defaults are the Quest and Touch layout and change nothing.
; Values: trigger, grip, a, b (x, y on the left), thumbstick, grip_click, axis3, axis4, pad_up, pad_down, pad_left, pad_right, pad_center (trackpad click regions), none.
; Swapping two buttons moves every action of each. Stick movement is never remapped.
; Controllers whose SteamVR binding merges buttons (Index A reports as grip) need the binding fixed in SteamVR first; ROCK only sees what SteamVR sends.
; This key: the right trigger.
sRightTriggerButton = trigger

; The right grab button (grip by default).
sRightGrabButton = grip

; Right A: reload tap, scope hold.
sRightAButton = a

; Right B: grenade draw hold, VATS.
sRightBButton = b

; Right stick click: bipod latch; opens PALM by default.
sRightStickClickButton = thumbstick

; The left trigger.
sLeftTriggerButton = trigger

; The left grab button (grip by default).
sLeftGrabButton = grip

; Left X: reload tap and scope hold for a left firing hand.
sLeftXButton = x

; Left Y: Pip-Boy tap, Pause hold.
sLeftYButton = y

; Left stick click.
sLeftStickClickButton = thumbstick

; Block VATS
; Stops the game's VATS from opening on the VATS button (right B by default).
; The button still works for ROCK and other mods.
bSuppressNativeVats = false

; Pip-Boy and Pause Hold Time
; Tap left Y to open the Pip-Boy; hold it this many seconds to open the Pause menu instead. Range: 0.15 to 2.
fPipboyPauseHoldSeconds = 0.35


[NativeGameplay]

; === 10. Native Gameplay ===
; Melee Swing Speed
; Hand speed that starts a vanilla melee swing, in game units per second (70 = 1 metre per second). The game uses 200.
; Turning the wrist alone never swings. Range: 50 to 2000.
fVanillaMeleeSwingSpeed = 300

; Gun Bash Speed
; Hand speed that starts a vanilla gun bash, in game units per second (70 = 1 metre per second). The game uses 200.
; Turning the wrist alone never bashes. Range: 50 to 2000.
fVanillaGunBashSpeed = 400


[Highlight]

; === 11. Selection Feedback ===
; Grab Highlight
; Outlines the object your hand would grab.
bHighlightEnabled = true

; Grab Highlight Strength
; 1 = 40%. 2 = 60%. 3 = 80%. 4 = 100%.
iHighlightIntensityMode = 2

; Grab Highlight Color
; red, blue, orange or white.
sHighlightColor = blue
