; ROCK_example.ini - complete example of ROCK's compiled configuration defaults
;
; This file documents first-run and missing-key defaults. It is not the active
; production file, and active testing overrides do not change this catalog.
; ROCK never loads, packages, deploys, or copies this file.
;
; This file is grouped by what a user is likely to tune.
; Section names like [Debug] and [PhysicsInteraction] are read by the plugin.
; Headings that start with "; ---" are comments only.
;
; Unit notes:
; - "game units" are Fallout world units.
; - "Havok units" are meters. In FO4VR, 1 Havok meter is about 70 game units.
; - Hex filter values are written without "0x".
;
; Missing keys use the compiled defaults. Keep a backup before tuning.

; ============================================================================
; CONSUMER OPTIONS
; ============================================================================
; Gameplay features, comfort choices, interaction behavior, and tuning.

[Logging]

; ROCK.log detail level for normal plugin messages.
; Modes: 0=trace, 1=debug, 2=info, 3=warn, 4=error, 5=critical, 6=off.
; Trace/debug/info can be expensive if hot-path diagnostics are enabled.
; Set 6 to keep the main ROCK.log silent during performance testing.
iLogLevel = 2

[RealisticWeapons]

; Seconds from pin pull to ROCK detonation. Set 0 to use the grenade projectile's native fuse timer.
fRealisticGrenadeFuseSeconds = 5.0


[ImmersiveWeapons]

; Allows whichever physical hand owns the firing grip to release the equipped weapon.
; With another carry grip the weapon enters part carry; otherwise it drops.
; bEquippedWeaponToggleGrabEnabled independently selects hold or toggle input.
bFiringGripDetachEnabled = true

; Keeps the weapon's position and rotation at the final two-hand pose when the
; firing grip detaches into support-hand part carry. Subsequent support-hand
; motion moves the weapon from that pose without an initial correction.
bFiringGripDetachPosePreservationEnabled = true

; Reach of the firing-grip reattach zone in game units: two cylinders start at the
; grip point and run this far out along each side of the weapon's lateral axis. A
; squeeze by either eligible hand inside one of them re-takes the grip. The default
; matches the offhand activation reach (fWeaponInteractionProbeRadius).
fFiringGripReattachRadiusGameUnits = 12.0

; Radius in game units of each firing-grip reattach cylinder: how far the palm may
; sit off the lateral axis anywhere along the reach.
fFiringGripReattachCylinderRadiusGameUnits = 2.0

; Successful firing-grip attach and detach transition pulses on the acting hand.
fFiringGripHapticDurationSeconds = 0.10
fFiringGripAttachHapticIntensity = 0.85
fFiringGripDetachHapticIntensity = 0.30


[AmbidextrousFiring]

; ROCK's standalone/fallback firing-grip policy. Either hand can inherit the
; firing grip when the current firing hand opens while the other hand is
; wrapped over it. A loose weapon held in the left hand can also be equipped
; directly with that same hand's trigger. The Immersive Weapons firing-grip
; detach feature is independent and never forces this handoff mode or its
; left-firing aim tuning.
; ROCK's equipped-weapon shoulder stash uses a native shoulder release gesture;
; it does not enable firing-grip detach or world dropping. When immersive
; detach is disabled, firing ownership changes only by handoff, direct
; trigger-equip, an external/native holster, or weapon cleanup.
; Requires the matching hFRIK weapon-pose and weapon-node ownership APIs;
; fails closed to the configured fixed firing hand when unavailable.
bAmbidextrousFiringGripEnabled = true

; Restricts ordinary equipped-weapon support grabs to the modeler's current
; authored support seat. A valid authored seat and its mirrored counterpart are
; independent of generated collision; the current hand must still enter the
; topology-specific cone/radius. Missing, stale, or transitional authored data
; fails closed; a current weapon/topology with no authored support pose retains
; ROCK's dynamic mesh/finger fallback. A matched ROCK API weapon-part target always wins and
; keeps its declared FullTwoHandAuthority or AttachOnly mode. This setting is
; independent of bAmbidextrousFiringGripEnabled and affects either support hand.
bAuthoredOnlyEquippedWeaponSupportGrabsEnabled = true

; Optional ROCK-owned input mode for equipped-weapon grips. The first grab
; press latches the acquired support or firing grip; the next press releases
; that same physical hand. Loose objects, surfaces, and provider touch grabs
; keep hold-to-grab input. Immersive Weapons uses this same ROCK preference;
; it never installs a separate input mode.
bEquippedWeaponToggleGrabEnabled = false

; A support hand wrapped over the firing grip takes it over in place when the
; firing hand opens, if its grip point is within this distance of the firing
; grip. Game units (~1.4cm).
fFiringGripPromotionRadius = 5.0

; Global trim for the LEFT-hand firing hold. Rotation is in degrees, range
; -30..30. Position offsets are game units, range -15..15. Zero values keep
; ROCK's mirrored per-weapon firing hold without additional global correction.
fLeftFiringAimYawDegrees = 0.0
fLeftFiringAimPitchDegrees = 0.0
fLeftFiringAimOffsetXGameUnits = 0.0
fLeftFiringAimOffsetYGameUnits = 0.0
fLeftFiringAimOffsetZGameUnits = 0.0


[NativeScopes]

; Hold the lower face button on the physical firing hand (right A or left X)
; past the threshold to activate, keep holding to remain scoped, and release
; to exit. Releasing before the threshold dispatches reload once.
fManualScopeHoldSeconds = 0.30

; Missing or unusable generated Scope/Sight geometry falls back to the current
; firing-grip palm seat. Set the force switch only when ROCK accepts a bad
; optic collider and you need to bypass it while tuning. Offsets are game units
; from that firing-grip origin in Weapon-local axes: X lateral, +Y muzzle
; forward, and Z vertical. Zeroes place the anchor exactly at the firing grip.
; Rotations are additive degrees after native camera calibration: pitch about
; X, yaw about Z, and roll about +Y/the muzzle axis. Position moves activation,
; camera, and overlay together; rotation corrects the camera and overlay only.
bNativeScopeForceFiringGripFallback = false
fNativeScopeFiringGripFallbackOffsetXGameUnits = 0.0
fNativeScopeFiringGripFallbackOffsetYGameUnits = 0.0
fNativeScopeFiringGripFallbackOffsetZGameUnits = 0.0
fNativeScopeFiringGripFallbackPitchDegrees = 0.0
fNativeScopeFiringGripFallbackYawDegrees = 0.0
fNativeScopeFiringGripFallbackRollDegrees = 0.0

; Fine-tunes only FO4VR's game-native world_scope.nif overlay. ROCK keeps the
; activation camera on the resolved generated-sight/firing-grip anchor
; independently, so these values do not change when the native scope activates.
; Zero values keep automatic anchor placement plus Bethesda's native
; model orientation/scale. Offsets are game units in the calibrated model-local
; frame. Rotations are degrees: pitch about local X, yaw about local Z, and roll
; about the optical/depth Y axis. Tune one axis at a time; loose replacement
; NIFs can use a visually reversed sign convention.
fNativeScopeOverlayOffsetXGameUnits = 0.0
fNativeScopeOverlayOffsetYGameUnits = 0.0
fNativeScopeOverlayOffsetZGameUnits = 0.0
fNativeScopeOverlayPitchDegrees = 0.0
fNativeScopeOverlayYawDegrees = 0.0
fNativeScopeOverlayRollDegrees = 0.0

[PhysicsInteraction]

; ============================================================================
; 1. Physics Timing
; ============================================================================

; Stabilizes FO4VR physics timing when rendering falls below the reference rate.
bHavokTimingFixEnabled = true
fHavokTimingFixMinPhysicsFrameRate = 70.0
iHavokTimingFixMaxSubsteps = 3

; ============================================================================
; 2. Controller Input
; ============================================================================

; Stops the right stick click from opening Favorites, keeping the button clean
; for ROCK's own thumbstick-click gestures (e.g. saved grab offsets) and for
; external mods/API consumers reading raw controller state.
bSuppressRightFavoritesGameInput = true

; Blocks ordinary VATS when the native VATS button is released.
; The raw OpenVR button remains readable.
bSuppressNativeVats = false

; ROCK owns the native Pause button during gameplay. Releasing it before this
; threshold opens the Pip-Boy; holding through the threshold opens Pause. On
; Quest 2 this is Y in right-handed mode and follows Bethesda's secondary-wand
; mapping in left-handed mode. The old trigger-release Pip-Boy open is disabled.
fPipboyPauseHoldSeconds = 0.35

; Keeps the pipboy-hand trigger's flashlight hold from firing while that hand
; is engaged in a ROCK interaction: holding an object, two-handing/supporting
; the equipped weapon, or carrying a part while the primary grip is detached.
; Raw OpenVR trigger state stays readable for consumer mods.
bSuppressPipboyGameInputWhileHolding = true

; Blocks the native Activate/WandAccept take-into-inventory or auto-equip outcome
; (A button on Quest 2) while the SAME hand whose wand is activating is holding a
; ROCK object. Generic Activate (open door, talk to NPC, search container, read
; note/terminal) keeps working on the same button - only takeable/equippable
; targets are suppressed, classified by the picked reference's form type below.
bSuppressTakeEquipGameInputWhileHolding = true

; Comma/space-separated list of form types treated as "take/equip" for the
; suppression above (matches TESForm::GetFormTypeString(), e.g. WEAP/ARMO/MISC).
; Targets whose form type is not in this list are never suppressed.
sSuppressTakeEquipFormTypes = WEAP,ARMO,AMMO,MISC,INGR,ALCH,BOOK,KEYM,SLGM

; Keeps a grab press alive briefly while selection, pull catch, or input suppression settles.
; This leeway/force state only feeds ROCK's internal grab edge.
fGrabInputLeewaySeconds = 0.12
fGrabInputForceSeconds = 0.08

; ============================================================================
; 3. Palm And Pointing Directions
; ============================================================================

; Legacy authored palm pivot used by API palm position, telemetry, debug tuning,
; two-handed grip, and non-dynamic helpers.
; Dynamic object grabs use the generated hidden proxy authority pivot below.
fRightGrabLegacyPalmPivotAHandspaceX = 6.0
fRightGrabLegacyPalmPivotAHandspaceY = -2.0
fRightGrabLegacyPalmPivotAHandspaceZ = 0.2
fLeftGrabLegacyPalmPivotAHandspaceX = 6.0
fLeftGrabLegacyPalmPivotAHandspaceY = -2.0
fLeftGrabLegacyPalmPivotAHandspaceZ = -0.2

; Local offset for the hidden grab authority proxy/seat point, in corrected palm proxy space.
; X follows the fingers, -Y moves into the palm face/skin, +Y moves to the back of the hand,
; and Z moves across the palm. This does not move the real palm/finger physics colliders.
fRightGrabAuthorityProxyOffsetXGameUnits = 0.0
fRightGrabAuthorityProxyOffsetYGameUnits = -2.0
fRightGrabAuthorityProxyOffsetZGameUnits = 0.0
fLeftGrabAuthorityProxyOffsetXGameUnits = 0.0
fLeftGrabAuthorityProxyOffsetYGameUnits = -2.0
fLeftGrabAuthorityProxyOffsetZGameUnits = 0.0

; ============================================================================
; 4. Weapon Collision And Support Grip
; ============================================================================

; Controls whether ROCK weapon hulls collide with projectile/spell layers.
; False avoids self-collisions with modded projectile systems while aiming.
bWeaponCollisionBlocksProjectiles = false
bWeaponCollisionBlocksSpells = false

; Seconds ROCK waits for the visual weapon tree to stay visible/stable before replacing generated hulls after weapon/mod swaps.
fWeaponCollisionVisualStabilizationSeconds = 0.0889

; Maximum speed allowed when ROCK keyframes generated weapon hulls.
fWeaponCollisionMaxLinearVelocity = 50.0
fWeaponCollisionMaxAngularVelocity = 100.0

; Immediately resets a failed dynamic weapon collider onto the firing hand if
; its live firing-grip authority point is farther away than this distance.
; This catastrophic-failure limit is separate from normal wall-contact
; convergence. 210 game units is about 3 metres. Game units (~1.4cm each).
fWeaponCollisionGripRecoveryDistanceGameUnits = 210.0

; Small surface-vicinity radius around each configured legacy palm pivot.
; Physical contact uses it to decide whether the live palm reached an authored
; seat, and every authored support seat must also be this close to the current
; generated weapon mesh. An off-weapon authored seat uses ROCK's dynamic seat.
fWeaponInteractionTouchRadius = 2.0

; Broader per-hand search used when the palm is not touching the weapon.
; With authored weapon grips enabled, a grab acquired only by this probe may
; use the modeler's authored support seat only when the surface check above
; confirms that seat belongs to the current weapon.
fWeaponInteractionProbeRadius = 12.0

; Every support grab inside this distance from the firing grip stays visual-only
; so pistols retain a stable support pose without competing weapon authority.
; ROCK always owns this behavior. An active equipped-weapon addon may override
; only the radius through the ROCK V1 API. Game units (~1.4cm each).
fFiringGripProximitySupportRadius = 6.0

; Eases equipped-weapon support acquisition. Normal dynamic full-authority grabs
; share this timing across support steering and both hand roots; authored,
; provider-owned, AttachOnly, and visual-only grabs retain their existing paths.
bWeaponSupportGripHandLerpEnabled = true
fWeaponSupportGripHandLerpTimeMin = 0.12
fWeaponSupportGripHandLerpTimeMax = 0.20
fWeaponSupportGripHandLerpMinDistance = 1.0
fWeaponSupportGripHandLerpMaxDistance = 14.0

; Seats the visual support palm toward the contacted surface without rotating
; the weapon. The shortest-arc correction preserves controller twist as much as
; possible and is clamped to avoid wrist flips on unstable geometry.
bWeaponSupportSurfaceSeatEnabled = true
fWeaponSupportSurfaceSeatMaxDegrees = 35.0

; ============================================================================
; 5. Dynamic Hand World Collision
; ============================================================================

; ============================================================================
; 6. Native Melee Suppression
; ============================================================================

; One complete switch for Fallout VR player melee. False restores every native
; real-weapon input, swing, hit-frame, impact, damage, and VRInput-setting path.
; True suppresses that complete chain. The change is applied by live INI reload;
; NPC melee always passes through.
bNativeMeleeSuppressionEnabled = false

; Filters only the native player character-controller bubble contacts.
; Keeps world/support blocker layers, but prevents the vanilla bubble from pushing clutter, guns, actors, ragdolls, and ROCK-generated bodies.
bNativeCharacterControllerObjectContactFilterEnabled = true

; ============================================================================
; 7. Selection Feedback
; ============================================================================

; Highlights the object ROCK thinks your hand can grab.
bHighlightEnabled = true
; ROCK-owned grab highlight intensity: 1=40%, 2=60%, 3=80%, 4=100%.
iHighlightIntensityMode = 3
; ROCK-owned grab highlight color: red, blue, orange, or white.
sHighlightColor = orange

bSelectionBeamEnabled = true
fSelectionBeamSegmentSizeGameUnits = 1.15
fSelectionBeamCurveLiftGameUnits = 8.0
fSelectionBeamAlpha = 0.72
; ============================================================================
; 8. Hand And Body Collision From Skeleton Bones
; ============================================================================

; Creates generated keyframed colliders for the torso, arms, legs, and feet.
; False disables the entire body set while leaving hand and finger colliders alive.
bBodyBoneCollidersEnabled = true

; Adds leg and foot colliders to the generated body set.
; False keeps torso and arm colliders while omitting every leg and foot body.
bBodyBoneLegAndFootCollidersEnabled = false

; Global generated body collider size scales. Power armor starts from a separate larger descriptor set, then applies these scales.
fBodyBoneColliderStandardRadiusScale = 1.0
fBodyBoneColliderStandardLengthScale = 1.0
fBodyBoneColliderStandardConvexRadiusScale = 1.0
fBodyBoneColliderPowerArmorRadiusScale = 1.0
fBodyBoneColliderPowerArmorLengthScale = 1.0
fBodyBoneColliderPowerArmorConvexRadiusScale = 1.0

; Role-specific scales applied after the standard/power-armor profile scale.
fBodyBoneColliderTorsoRadiusScale = 1.0
fBodyBoneColliderArmRadiusScale = 1.0
fBodyBoneColliderLegRadiusScale = 1.0
fBodyBoneColliderFootRadiusScale = 1.0
fBodyBoneColliderTorsoLengthScale = 1.0
fBodyBoneColliderArmLengthScale = 1.0
fBodyBoneColliderLegLengthScale = 1.0
fBodyBoneColliderFootLengthScale = 1.0

; Optional descriptor-specific size overrides for tuning stash/holster/backpack zones.
; Format: Zone=radius,length,convex;PowerArmor.Zone=radius,length,convex
; Zone names: Pelvis, SpineLower, SpineUpper, Chest, NeckHead, LeftShoulder, LeftUpperArm, LeftForearmUpper,
; LeftForearmLower, LeftHand, RightShoulder, RightUpperArm, RightForearmUpper, RightForearmLower, RightHand,
; LeftHip, LeftThigh, LeftCalf, LeftFoot, RightHip, RightThigh, RightCalf, RightFoot.
sBodyBoneColliderZoneScaleOverrides =
; Optional individual generated body collider radius scale overrides.
; Format: Zone=radiusScale;StartBone>EndBone=radiusScale;PowerArmor.Zone=radiusScale;PowerArmor.StartBone>EndBone=radiusScale
; Examples: LeftForearmLower=0.85;RArm_ForeArm2>RArm_ForeArm3=0.90;PowerArmor.Chest=1.10
sBodyBoneColliderRadiusScaleOverrides =
; Allows generated hand colliders to collide with static/animstatic world geometry for native contact evidence.
bHandCollisionStaticWorldEnabled = true

; Makes every dynamic-hand world-surface contact eligible for ROCK's fixed-anchor grab fallback.
; Touch a wall, tree, terrain, animstatic, or explicitly tagged car with the palm/fingertips and
; press grip to hold the hand there until release. Explicit provider touch-grab targets win first.
bGlobalSurfaceGrabEnabled = true

; Uses the contacted render mesh as the spatial authority for a fixed-surface
; grab. Havok still identifies the target, but the presented hand, API anchor,
; and mesh finger pose move from the collision shell onto the visible surface.
; Disabled keeps the established collision-shell latch as the control.
bSurfaceMeshGrabEnabled = false

; Maximum accepted gap from the Havok contact to the visible mesh, in game units.
fSurfaceMeshGrabMaxProjectionDistanceGameUnits = 48.0

; Hard one-shot acquisition budgets. A scene subtree or individual shape that
; cannot be examined inside these limits falls back to the collision-shell latch.
iSurfaceMeshGrabMaxTriangles = 20000
iSurfaceMeshGrabMaxPatchTriangles = 2048

; Optional generated hand capsule-like collider radius scale overrides. Palm-box roles are controlled by X/Y/Z below.
; Role names: ThumbBase, ThumbMiddle, ThumbTip, IndexBase, IndexMiddle, IndexTip, MiddleBase, MiddleMiddle,
; MiddleTip, RingBase, RingMiddle, RingTip, PinkyBase, PinkyMiddle, PinkyTip.
; Format: Role=radiusScale;PowerArmor.Role=radiusScale
sHandBoneColliderRadiusScaleOverrides =
; Optional generated palm-box collider local dimension scale overrides.
; Local X=fingers/segment length, local Y=palm depth, local Z=cross-palm width.
; Role names: PalmAnchor, PalmFace, PalmBack, PalmHeel, ThumbPad.
; Format: Role=xScale,yScale,zScale;PowerArmor.Role=xScale,yScale,zScale
sHandPalmColliderDimensionScaleOverrides =

; Requires the palm anchor before creating hand bone colliders.
bHandBoneCollidersRequirePalmAnchor = true

; Speed clamps for bone-driven hand colliders.
fHandBoneColliderMaxLinearVelocity = 200.0
fHandBoneColliderMaxAngularVelocity = 500.0

; ============================================================================
; 9. Object Selection, Pulling, And Push Assist
; ============================================================================

; Far grabs pull the object's CENTER to the hand instead of the ray-hit point
; (a hit at selection range is aim noise, not grip intent). The arrival seat
; then settles the surface onto the palm via the seat machinery.
bPullToObjectCenterEnabled = true

; Long-object presentation during pull flight: rotates elongated props (brooms,
; bottles) so their mesh long axis lines up with the hand Weapon node handle
; axis (the way a weapon sits in the hand) before arrival; the seat finishes
; the same alignment on every rod grab. Elongation is the RMS extent ratio
; between the mesh's dominant and second axis (compact objects ~1 skip
; presentation). Gain is proportional rad/s per rad of error.
bPullLongAxisPresentationEnabled = true
fPullPresentationMinElongationRatio = 2.0
fPullPresentationAngularGainPerSecond = 6.0
fPullPresentationMaxAngularSpeedRadiansPerSecond = 8.0

; Maximum scene-node depth used when scanning an object for physics bodies.
iObjectPhysicsTreeMaxDepth = 12

; Lets moving hands or weapon hulls nudge already-dynamic props.
; It never converts static or keyframed objects into dynamic objects.
bDynamicPushAssistEnabled = true
fDynamicPushMinSpeed = 0.35
fDynamicPushMaxImpulse = 2.0
fDynamicPushCooldownSeconds = 0.08

; ============================================================================
; 10. Grab Drive Feel
; ============================================================================

; Custom dynamic-grab drive used by all loose object holds.
; The held object uses finite linear/angular motors against a hidden no-contact
; proxy. Translation comes from the live palm/proxy anchor, while rotation comes
; from the root-flattened raw hand/controller frame.

; Linear shared-constraint motor response. Lower tau is stiffer and faster. Higher damping calms oscillation.
fGrabLinearTau = 0.03
fGrabLinearDamping = 0.8
fGrabLinearProportionalRecovery = 2.0
fGrabLinearConstantRecovery = 1.0

; Angular shared-constraint motor response. Same idea as linear motor, but for rotation.
fGrabAngularTau = 0.03
fGrabAngularDamping = 0.8
fGrabAngularProportionalRecovery = 2.0
fGrabAngularConstantRecovery = 1.0

; Maximum force the grab constraint can apply.
fGrabConstraintMaxForce = 2000.0

; Keeps the motor's effective mass finite for very light or unstable bodies.
bGrabEffectiveMotorMassFloorEnabled = true
fGrabEffectiveMotorMassFloor = 2.0

; Scales grab force for the active physics rate around the 90 Hz reference.
bGrabPhysicsRateForceScalingEnabled = true
fGrabPhysicsRateReferenceHz = 90.0
fGrabPhysicsRateForceScaleExponent = 0.5
fGrabPhysicsRateMinForceScale = 0.75
fGrabPhysicsRateMaxForceScale = 1.35

; Caps force by object mass so light objects do not explode out of the hand.
fGrabMaxForceToMassRatio = 500.0

; Settle delay before the force-grab API (grenade menu auto-equip, provider
; force-grab command) trusts the live hand transform and freezes the object's
; grab-authority relation, so a just-spawned/just-targeted object never snaps
; against a stale same-instant hand pose.
fForceGrabAttachSettleSeconds = 0.10

; Time for grab force to ramp in after pickup.
fGrabForceFadeInTime = 0.1

; Multipliers for non-equipped weapon refs grabbed as loose dynamic objects.
; Loose weapons keep the same mass cap as generic objects, but get the
; a higher base force before that cap is applied. Angular force is
; separate so long multipart weapons can rotate without increasing linear pull.
fGrabLooseWeaponSharedConstraintLinearTauMultiplier = 1.0
fGrabLooseWeaponSharedConstraintAngularTauMultiplier = 1.0
fGrabLooseWeaponSharedConstraintCollisionTauMultiplier = 1.0
fGrabLooseWeaponSharedConstraintLinearDampingMultiplier = 1.0
fGrabLooseWeaponSharedConstraintAngularDampingMultiplier = 1.0
fGrabLooseWeaponSharedConstraintMaxForceMultiplier = 4.5
fGrabLooseWeaponSharedConstraintAngularForceMultiplier = 2.0
fGrabLooseWeaponSharedConstraintLinearRecoveryMultiplier = 1.0
fGrabLooseWeaponSharedConstraintAngularRecoveryMultiplier = 1.0

; Contact-softened tau. Normal held linear/angular tau stay fixed at their base values.
fGrabTauMin = 0.01
fGrabTauLerpSpeed = 0.5

; Reduces held angular speed for long objects by grip-to-extents lever length.
; This keeps long guns/objects from sweeping as if their far end had no leverage.
bGrabLongObjectAngularScalingEnabled = true
fGrabLongObjectReferenceLeverGameUnits = 24.0
fGrabLongObjectMinAngularScale = 0.35

; Clamps extreme inertia tensors on grabbed rigid bodies to keep the solver stable.
fGrabMaxInertiaRatio = 10.0
fGrabMinInertia = 0.01

; ============================================================================
; 11. Grab Safety, Release, And Player Movement
; ============================================================================

; Force-releases if the held object stays too far from the palm for too long.
fGrabMaxDeviation = 50.0
fGrabMaxDeviationTime = 2.0

; Multiplies held-object velocity when you release to throw.
fThrowVelocityMultiplier = 1.5

; Uses tracked hand velocity, COM-relative angular swing, and a small object-velocity blend for throws.
bGrabControllerDerivedThrowVelocityEnabled = true
fGrabThrowObjectVelocityBlend = 0.35
fGrabThrowTangentialVelocityScale = 1.0
fGrabThrowMaxVelocityHavok = 12.0
fGrabThrowAngularVelocityScale = 1.0
fGrabThrowMaxAngularVelocityRadiansPerSecond = 18.0

; Keeps hand collision suppressed briefly after release so the object is not launched instantly.
fGrabReleaseHandCollisionDelaySeconds = 0.10

; Shoulder stash transfers a held loose item to inventory when grip is released inside the HMD-relative back volume.
; Generated FRIK body-zone colliders are backup evidence for tracking loss and remain the preferred path for holsters.
bShoulderStashEnabled = true

; Equipped weapons use the same HMD-relative back volumes and remain equipped.
; With toggle-grab, press inside to sheath or retrieve; release only rearms.
; With hold-to-grab, hold inside and release to sheath; press inside to
; retrieve, then pull forward or release while the weapon remains drawn.
; Ambidextrous firing honors either hand. This ROCK-owned path does not require
; ROCK Immersive Weapons.
bEquippedWeaponShoulderStashEnabled = true
bShoulderStashUseBodyZoneColliders = true
bShoulderStashUseHmdBackVolume = true
fShoulderStashEnterPaddingGameUnits = 5.0
fShoulderStashExitPaddingGameUnits = 8.0
fShoulderStashMinDwellSeconds = 0.08
fShoulderStashMaxSpeedGameUnitsPerSecond = 140.0
fShoulderStashRecentContactSeconds = 0.0444
fShoulderStashSustainedContactMissSeconds = 0.2
fShoulderStashHmdBackRightOffsetXGameUnits = 14.0
fShoulderStashHmdBackRightOffsetYGameUnits = -18.0
fShoulderStashHmdBackRightOffsetZGameUnits = -6.85
fShoulderStashHmdBackLeftOffsetXGameUnits = -14.0
fShoulderStashHmdBackLeftOffsetYGameUnits = -18.0
fShoulderStashHmdBackLeftOffsetZGameUnits = -6.85
fShoulderStashHmdBackRadiusGameUnits = 11.0
fShoulderStashHmdBackEnterPaddingGameUnits = 0.0
fShoulderStashHmdBackExitPaddingGameUnits = 2.0
fShoulderStashHmdBackMinBehindGameUnits = 4.0
bShoulderStashShowCollectedNotifications = true

; Mouth consume uses a tight HMD-relative sphere near the mouth.
; Only loose ALCH ingestibles can become mouth candidates; other objects use backpack stash/drop paths.
bMouthConsumeEnabled = true
bMouthConsumeAllowPoison = false
fMouthConsumeHmdOffsetXGameUnits = 0.0
fMouthConsumeHmdOffsetYGameUnits = 7.0
fMouthConsumeHmdOffsetZGameUnits = -7.0
fMouthConsumeRadiusGameUnits = 5.5
fMouthConsumeEnterPaddingGameUnits = 0.0
fMouthConsumeExitPaddingGameUnits = 1.0
fMouthConsumeMinDwellSeconds = 0.08
fMouthConsumeMaxSpeedGameUnitsPerSecond = 120.0

; Removes leftover object velocity while held. 0=no damping, 1=stop instantly.

; Preserves player locomotion separately from held-object residual velocity.

; Temporarily calms nearby dynamic clutter when a grab starts.
; Uses verified FO4VR hknp motion-property damping leases with safe restore.
; Damping values are hknp per-second coefficients, not normalized percentages.
bGrabNearbyDampingEnabled = true
fGrabNearbyDampingRadius = 90.0
fGrabNearbyDampingSeconds = 0.35
fGrabNearbyLinearDamping = 3.0
fGrabNearbyAngularDamping = 5.5

; Reduces player movement speed while carrying held mass.
bGrabHeldMassMovementSlowdownEnabled = true
fGrabHeldMassMovementMassProportion = 0.675
fGrabHeldMassMovementMassExponent = 1.0
fGrabHeldMassMovementMaxReduction = 75.0
fGrabHeldMassMovementFadeOutSeconds = 5.0

; ============================================================================
; 12. Hand-Pocket Grab Acquisition
; ============================================================================

; Hand-pocket offset and radius, in game units, from the root-flattened palm frame.
fGrabPocketDepthGameUnits = 7.0
fGrabPocketRadiusGameUnits = 9.0

; Seat depth stop: pushes the held seat out along the palm normal by how far the
; object's mesh extends past the grip point toward the palm, so the object's
; surface rests ON the palm instead of its center being pulled into the hand.
; Skin is a small extra gap. The depth cap and palm footprint radius are fixed.
fGrabSeatDepthSkinGameUnits = 0.5

; ============================================================================
; 13. Grab Contact Evidence
; ============================================================================

fGrabSurfaceBehindPalmToleranceGameUnits = 1.5

; Maximum age in seconds for semantic contacts used as touch evidence.
fGrabOppositionContactMaxAgeSeconds = 0.0556

; Small-object pinch pocket. Chosen only at close-grab commit, then frozen for the hold.
bGrabPinchPocketEnabled = true

; Allows a fallback close-selection cast along the pinch direction when the palm close cast misses.
bGrabPinchCloseSelectionEnabled = true
fGrabPinchCompactMaxExtentGameUnits = 8.0
fGrabPinchThinRodMaxLengthGameUnits = 18.0
fGrabPinchThinRodMaxCrossSectionGameUnits = 4.0
fGrabPinchMaxPocketDistanceGameUnits = 8.0
fGrabPinchMinFingerGapGameUnits = 1.0
fGrabPinchMaxFingerGapGameUnits = 12.0
fGrabPinchThumbIndexMaxOpenValue = 0.45
fGrabPinchOtherFingerCurlValue = 0.20
fGrabPinchSurfaceInsetGameUnits = 0.5

; Pinch detection direction is authored in ROCK hand space: X=fingers, Y=palm depth, Z=signed cross-palm.
fGrabPinchDetectionDirectionHandspaceX = 1.0
fGrabPinchDetectionDirectionHandspaceY = 0.0
fGrabPinchDetectionDirectionHandspaceZ = 0.0

; Blends the live thumb-index axis with the authored pinch direction for mesh surface search.
fGrabPinchDetectionAxisBlend = 0.65

; Moves the rendered hand toward the mesh-matched held pose during grab startup.
bGrabHandLerpEnabled = true
fGrabHandLerpTimeMin = 0.10
fGrabHandLerpTimeMax = 0.20
fGrabHandLerpMinDistance = 7.0
fGrabHandLerpMaxDistance = 14.0

; Smooths the rendered hand back to live tracking after releasing a grabbed object.
bGrabHandReturnEnabled = true
fGrabHandReturnTimeMin = 0.10
fGrabHandReturnTimeMax = 0.20
fGrabHandReturnMinDistance = 7.0
fGrabHandReturnMaxDistance = 14.0
fGrabHandReturnMinAngleDegrees = 5.0
fGrabHandReturnMaxAngleDegrees = 90.0

; ============================================================================
; 14. Finger Pose
; ============================================================================

; Computes custom finger curl from the held object's visible mesh.
bGrabMeshFingerPoseEnabled = true

; Sends per-joint finger values to FRIK when available instead of one curl per finger.
bGrabMeshJointPoseEnabled = true

; Lowest allowed finger value. 0=fully closed, 1=fully straight.
fGrabFingerMinValue = 0.2

; Maximum per-second finger pose movement.
fGrabFingerPoseSmoothingSpeed = 14.0

; Uses FRIK's authored finger joint transforms plus bounded mesh-contact aim correction.
bGrabMeshLocalTransformPoseEnabled = true
fGrabFingerLocalTransformSmoothingSpeed = 14.0
fGrabFingerLocalTransformMaxCorrectionDegrees = 35.0
fGrabFingerSurfaceAimStrength = 0.75
bGrabFingerRejectBacksideHits = true
fGrabFingerSurfacePlaneToleranceGameUnits = 1.5
fGrabFingerSweepContactRadiusGameUnits = 1.0
; How far past the authored open pose fingers may hyper-extend when an
; object is thicker than the open finger span (hFRIK flex units: 1.0 =
; authored open pose, 2.0 = engine ceiling). The swept-arc close starts
; from the most-open allowed row, so a raised cap lets fingers lie flat
; on surfaces that interpenetrate the default open hand. Valid range
; 1.0-2.0; out-of-range silently falls back to the full 2.0 sweep ceiling.
fGrabFingerSweepMaxOpenValue = 2.0
fGrabThumbSweepMaxOpenValue = 2.0
fGrabThumbOppositionStrength = 1.0
fGrabThumbAlternateCurveStrength = 0.65
bGrabThumbSurfaceSafetyEnabled = true
fGrabThumbSurfaceSafetyMarginGameUnits = 1.0

