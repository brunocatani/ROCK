; ============================================================================
; 12. Hand-Pocket Grab Acquisition
; ============================================================================

; Distance from the hand pocket where an object is considered already touching.
fGrabTouchAcquireDistanceGameUnits = 4.0

; Distance where the object should converge into the palm pocket instead of finalizing immediately.
fGrabNearConvergeDistanceGameUnits = 28.0

; Hand-pocket offset and radius, in game units, from the root-flattened palm frame.
fGrabPocketDepthGameUnits = 7.0
fGrabPocketRadiusGameUnits = 9.0

; Seat depth stop: pushes the held seat out along the palm normal by how far the
; object's mesh extends past the grip point toward the palm, so the object's
; surface rests ON the palm instead of its center being pulled into the hand.
; Max caps the correction (0 disables it). Footprint is the lateral radius around
; the palm axis that counts as "over the palm". Skin is a small extra gap.
fGrabSeatDepthMaxGameUnits = 30.0
fGrabSeatDepthFootprintRadiusGameUnits = 10.0
; Penetration backstop footprint, plate-shaped objects only: the final seat is
; re-checked from the palm plane and pushed out if mesh still reaches past it.
; The seating footprint above is deliberately narrow, which bounds how much a
; TILTED face can register (at radius r a face tilted by theta shows at most
; r*sin(theta)), so flat objects use this hand-sized radius for the safety
; check instead. Other shapes keep the seating radius so geometry passing
; beside the palm cannot push seats out. Valid range 1-30, else 6.
fGrabSeatPenetrationBackstopFootprintRadiusGameUnits = 6.0
fGrabSeatDepthSkinGameUnits = 0.5

; Moves the captured grip point slightly inside the object from the raw hit/mesh seed.
fGrabGripInsetGameUnits = 2.0

; Optional near-converge diagnostic timeout. A value of 0 disables timeout promotion.
fGrabConvergeMaxTimeSeconds = 0.35
fGrabConvergeStableSeconds = 0.033333335
fGrabConvergeMaxSeparatingSpeedGameUnitsPerSecond = 40.0
fGrabAcquisitionVisualStartDistanceGameUnits = 28.0

