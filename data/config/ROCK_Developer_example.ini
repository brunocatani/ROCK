; ROCK_Developer_example.ini - every developer option with its default and help
; Reference only: ROCK never reads this file. ROCK_Developer.ini in Documents\My Games\Fallout4VR\
; Mods_Config\ROCK holds only the developer options changed from these defaults.


[Debug]

; === 01. Developer Controls ===
; Gates advanced/tuning-only features not meant for normal play. Currently:
; pressing A while holding an object records/overwrites a saved grab offset
; for that object+hand. Saved offsets keep applying on future grabs
; regardless of this setting - it only gates recording new ones.
bDeveloperModeEnabled = false

; Emergency Disable Recoil
; ON: disables native VR recoil and kickback plus ROCK weapon/hand recoil, overriding every recoil profile.
; OFF: restores native recoil/kickback and the existing Immersive Recoil setting.
; Applies immediately, independently of Developer Mode. Does not change projectile spread.
bEmergencyDisableRecoil = false

; === 02. Logging and Profiling ===
; Text format for each ROCK.log line.
sLogPattern = %Y-%m-%d %H:%M:%S.%e [%l] %v

; Minimum time between repeated sampled diagnostic messages.
iLogSampleMilliseconds = 2000

; Writes each ROCK.log line to disk as it is logged.
; Off, the log is block buffered, so a freeze or a crash loses the last lines
; and every log ends mid-line. On, the tail survives, at one file write per line.
; Leave off unless you are chasing a hang.
bLogFlushImmediate = false

; Asynchronous performance profiler.
; Independent from iLogLevel. When enabled, timing scopes stay on the frame path,
; but completed profiler windows are queued to a bounded background writer.
; Output goes to ROCK_Profiler.log, not ROCK.log. File formatting/writes are not done
; by grab, reload, physics, or frame update code. If the writer falls behind, profiler
; windows are dropped instead of stalling gameplay.
bPerformanceProfilerEnabled = false

; Number of frames per queued profiler window after warmup. Larger values reduce file traffic.
iPerformanceProfilerLogIntervalFrames = 300

; Startup/reload frames ignored before profiler windows are emitted.
iPerformanceProfilerWarmupFrames = 120


[PhysicsInteraction]

; === 03. Palm and Grab Offsets ===
; Local offset for the hidden grab authority proxy/seat point, in corrected palm proxy space.
; X follows the fingers, -Y moves into the palm face/skin, +Y moves to the back of the hand,
; and Z moves across the palm. This does not move the real palm/finger physics colliders.
fRightGrabAuthorityProxyOffsetXGameUnits = 0.5
fRightGrabAuthorityProxyOffsetYGameUnits = -1
fRightGrabAuthorityProxyOffsetZGameUnits = 0
fLeftGrabAuthorityProxyOffsetXGameUnits = 0.5
fLeftGrabAuthorityProxyOffsetYGameUnits = -1
fLeftGrabAuthorityProxyOffsetZGameUnits = 0

; === 04. Weapon Collision and Support ===
; Controls whether ROCK weapon hulls collide with projectile/spell layers.
; False avoids self-collisions with modded projectile systems while aiming.
bWeaponCollisionBlocksProjectiles = false
bWeaponCollisionBlocksSpells = false

; New casings ignore the firing weapon's generated colliders for this many simulation milliseconds.
; Positive values protect at least one physics step. Zero disables the grace period. Range: 0-500 ms.
; World contacts and native casing lifetime are preserved. Changes apply to new casings.
fWeaponShellCollisionGraceMs = 30

; False: original convex fitting. True: bounded gap-preserving compounds.
; Changing this key rebuilds weapon colliders after live INI reload.
; Compare with bPerformanceProfilerEnabled: weaponColliderBuild/Create vs weaponGapColliderBuild/Create.
bWeaponCollisionPreserveGaps = true

; Seconds ROCK waits for the visual weapon tree to stay visible/stable before replacing generated hulls after weapon/mod swaps.
fWeaponCollisionVisualStabilizationSeconds = 0.0889

; Maximum speed allowed when ROCK keyframes generated weapon hulls.
fWeaponCollisionMaxLinearVelocity = 800
fWeaponCollisionMaxAngularVelocity = 800

; Immediately resets a failed dynamic weapon collider onto the firing hand if
; its live firing-grip authority point is farther away than this distance.
; This catastrophic-failure limit is separate from normal wall-contact
; convergence. 210 game units is about 3 metres. Game units (~1.4cm each).
fWeaponCollisionGripRecoveryDistanceGameUnits = 210

; Small sphere around each hand's palm point. If it overlaps a
; generated weapon collider, the grab uses ROCK's unrestricted dynamic seat.
fWeaponInteractionTouchRadius = 2

; Broader per-hand search used when the palm is not touching the weapon.
; With authored weapon grips enabled, a grab acquired only by this probe uses
; the modeler's authored firing/support seat instead of the dynamic mesh seat.
fWeaponInteractionProbeRadius = 12

; Testing only: authored support seats are never used, so every support grab
; runs the dynamic mesh grip. Use to test dynamic grips where an authored zone
; would win. Leave off for play.
bDebugWeaponSupportDynamicOnly = false

; Every support grab inside this distance from the firing grip stays visual-only
; so pistols retain a stable support pose without competing weapon authority.
; ROCK always owns this behavior. An active equipped-weapon addon may override
; only the radius through the ROCK V1 API. Game units (~1.4cm each).
fFiringGripProximitySupportRadius = 8

; Eases ROCK's external FRIK hand target into an equipped weapon support grip.
; This is visual-only: weapon aim authority remains immediate.
bWeaponSupportGripHandLerpEnabled = true
fWeaponSupportGripHandLerpTimeMin = 0.12
fWeaponSupportGripHandLerpTimeMax = 0.2
fWeaponSupportGripHandLerpMinDistance = 1
fWeaponSupportGripHandLerpMaxDistance = 14

; Seats the visual support palm toward the contacted surface without rotating the weapon.
bWeaponSupportSurfaceSeatEnabled = true
fWeaponSupportSurfaceSeatMaxDegrees = 35

; Thickness of the firing-grip reattach zone in game units (70 = 1 metre): how far above the grip point and how far forward or back along the barrel the palm may sit.
; A handling mod that selects the cylinder zone uses it as the cylinder radius. Range: 0.1 to 30.
fFiringGripReattachCylinderRadiusGameUnits = 3

; === 05. Hand and Body Collision ===
; Allows generated hand colliders to collide with static/animstatic world geometry for native contact evidence.
bHandCollisionStaticWorldEnabled = true

; Makes dynamic-hand world-surface contacts eligible for fixed-anchor grab fallback.
bGlobalSurfaceGrabEnabled = true

; Uses the contacted render mesh as the spatial authority for fixed-surface grabs.
bSurfaceMeshGrabEnabled = false
fSurfaceMeshGrabMaxProjectionDistanceGameUnits = 48
iSurfaceMeshGrabMaxTriangles = 20000

; Optional generated hand capsule-like collider radius scale overrides. Palm-box roles are controlled by X/Y/Z below.
; Role names: ThumbBase, ThumbMiddle, ThumbTip, IndexBase, IndexMiddle, IndexTip, MiddleBase, MiddleMiddle,
; MiddleTip, RingBase, RingMiddle, RingTip, PinkyBase, PinkyMiddle, PinkyTip.
; Format: Role=radiusScale;PowerArmor.Role=radiusScale
sHandBoneColliderRadiusScaleOverrides = 

; Optional generated palm-box collider local dimension scale overrides.
; Local X=fingers/segment length, local Y=palm depth, local Z=cross-palm width.
; Role names: PalmAnchor, PalmFace, PalmBack, PalmHeel, ThumbPad.
; Format: Role=xScale,yScale,zScale;PowerArmor.Role=xScale,yScale,zScale
sHandPalmColliderDimensionScaleOverrides = PalmAnchor=0.8,1.0,2.0

; Requires the palm anchor before creating hand bone colliders.
bHandBoneCollidersRequirePalmAnchor = true

; Speed clamps for bone-driven hand colliders.
fHandBoneColliderMaxLinearVelocity = 800
fHandBoneColliderMaxAngularVelocity = 800

; === 06. Selection and Pulling ===
; Direction the close grab looks for objects, from the palm toward the fingers.
; 0 = Straight out of the palm, 20 = 20 degrees toward the fingers, 45 = Halfway, 75 = 75 degrees toward the fingers, 90 = Straight along the fingers.
iCloseSelectionAngleDegrees = 0

; Direction the far grab looks for objects, from the palm toward the fingers. The target must also be inside the view cone.
; 0 = Straight out of the palm, 20 = 20 degrees toward the fingers, 45 = Halfway, 75 = 75 degrees toward the fingers, 90 = Straight along the fingers.
iFarSelectionAngleDegrees = 0

; Far grabs pull the object's CENTER to the hand instead of the ray-hit point
; (a hit at selection range is aim noise, not grip intent). The arrival seat
; then settles the surface onto the palm via the seat machinery.
bPullToObjectCenterEnabled = true

; Long-object presentation during pull flight: rotates elongated props (brooms,
; bottles) so their mesh long axis lines up with the hand's thumb->pinky line
; before arrival. Flight-only; held objects are never rotated. Elongation is the
; RMS extent ratio between the mesh's dominant and second axis (compact objects
; ~1 skip presentation). Gain is proportional rad/s per rad of error.
bPullLongAxisPresentationEnabled = true
fPullPresentationMinElongationRatio = 2
fPullPresentationAngularGainPerSecond = 6
fPullPresentationMaxAngularSpeedRadiansPerSecond = 8

; Tilts the presentation target off pure cross-palm Z toward fingers-forward
; +X, in degrees (0..45): the thumb occupies the pure-Z line, so the natural
; long-object hold sits a few degrees toward the fingertips. Applies to both
; the pull-flight servo and the force-grab seat alignment.
; This is an anatomical magnitude, not a signed rotation. Authored Z reverses
; its cross-palm direction between hands, but +X points toward the fingertips
; on both. ROCK resolves the live axes first, then tilts each signed Z axis
; toward its own +X, so one value has the same meaning for both hands.
fPullPresentationGripAxisTiltDegrees = 15

; Applies long-axis presentation alignment to force-grab arrival seats.
bForceGrabSeatAlignmentEnabled = true

; Applies face-to-palm roll alignment to programmatic arrival seats.
bGrabSeatRollAlignmentEnabled = true

; Shape-classification gate shared by the flight presentation servo and the
; grab pose solver: sqrt(lambda2/lambda3) of the mesh PCA at or above this
; ratio marks a distinct flat face (plate class). The solver uses the class
; for its rod-only terms; plates keep their edge/corner holds (31 verified
; plate holds put the face normal 63 deg off the palm normal - edge holds are
; the intended grip, not an artifact).
fGrabSeatRollMinSecondElongationRatio = 1.25

; Maximum scene-node depth used when scanning an object for physics bodies.
iObjectPhysicsTreeMaxDepth = 12

; === 07. Grab Drive ===
; Shared dynamic-grab response for held objects and equipped weapon colliders. Higher tau increases positional recovery. Damping calms oscillation; angular response remains independent.
fGrabLinearTau = 0.1
fGrabLinearDamping = 0.8
fGrabLinearProportionalRecovery = 2
fGrabLinearConstantRecovery = 1

; Angular shared-constraint motor response. Same idea as linear motor, but for rotation.
fGrabAngularTau = 0.03
fGrabAngularDamping = 0.8
fGrabAngularProportionalRecovery = 2
fGrabAngularConstantRecovery = 1

; Contact and initial-attachment linear force ceiling. Free motion uses actual mass and Free Linear Acceleration.
fGrabConstraintMaxForce = 2000

; Keeps the motor's effective mass finite for very light or unstable bodies.
bGrabEffectiveMotorMassFloorEnabled = true
fGrabEffectiveMotorMassFloor = 2

; Contact force per unit effective mass. This caps the contact ceiling for light objects.
fGrabMaxForceToMassRatio = 500

; Free-motion linear effort per unit effective driven mass, in Havok acceleration units. Contact keeps its separate ceiling.
fGrabFreeLinearAcceleration = 1000

; Free-motion angular effort per unit maximum principal inertia. The grip lever adds capacity to oppose off-center linear effort; the native solver determines the applied torque.
fGrabFreeAngularAcceleration = 6000

; Waits for a stable live hand transform before a force grab freezes its relation.
fForceGrabAttachSettleSeconds = 0.1

; Time for grab force to ramp in after pickup.
fGrabForceFadeInTime = 0.1

; Weapon response multipliers for both loose and equipped weapons. Max Force and Angular Force multipliers control contact and initial-attachment budgets. Free-motion budgets use actual mass, inertia, and the grip offset.
fGrabLooseWeaponSharedConstraintLinearTauMultiplier = 1
fGrabLooseWeaponSharedConstraintAngularTauMultiplier = 1
fGrabLooseWeaponSharedConstraintCollisionTauMultiplier = 1
fGrabLooseWeaponSharedConstraintLinearDampingMultiplier = 1
fGrabLooseWeaponSharedConstraintAngularDampingMultiplier = 1
fGrabLooseWeaponSharedConstraintMaxForceMultiplier = 4.5
fGrabLooseWeaponSharedConstraintAngularForceMultiplier = 2
fGrabLooseWeaponSharedConstraintLinearRecoveryMultiplier = 1
fGrabLooseWeaponSharedConstraintAngularRecoveryMultiplier = 1

; Contact-softened tau. Normal held linear/angular tau stay fixed at their base values.
fGrabTauMin = 0.01
fGrabTauLerpSpeed = 0.5

; Reduces held angular speed for long objects by grip-to-extents lever length.
; This keeps long guns/objects from sweeping as if their far end had no leverage.
bGrabLongObjectAngularScalingEnabled = true
fGrabLongObjectReferenceLeverGameUnits = 24
fGrabLongObjectMinAngularScale = 0.35

; Clamps extreme inertia tensors on grabbed rigid bodies to keep the solver stable.
fGrabMaxInertiaRatio = 10
fGrabMinInertia = 0.01

; === 08. Grab Safety and Release ===
; Multiplies held-object velocity when you release to throw.
fThrowVelocityMultiplier = 1.5

; Throws follow tracked hand movement. Wrist rotation supplies spin without steering the throw.
bGrabControllerDerivedThrowVelocityEnabled = true
fGrabThrowMaxVelocityHavok = 12
fGrabThrowAngularVelocityScale = 1
fGrabThrowMaxAngularVelocityRadiansPerSecond = 18

; Keeps hand collision suppressed briefly after release so the object is not launched instantly.
fGrabReleaseHandCollisionDelaySeconds = 0.8

; Shoulder stash transfers a held loose item to inventory when grip is released inside the HMD-relative back volume.
; Generated FRIK body-zone colliders are backup evidence for tracking loss and remain the preferred path for holsters.
bShoulderStashEnabled = true

; Equipped weapons, either one, use the same HMD-relative back volumes and return to the inventory.
; Toggle-grab: press inside with the hand carrying the weapon.
; Hold-to-grab: hold inside and release.
bEquippedWeaponShoulderStashEnabled = true
bShoulderStashUseBodyZoneColliders = true
bShoulderStashUseHmdBackVolume = true
fShoulderStashEnterPaddingGameUnits = 5
fShoulderStashExitPaddingGameUnits = 8
fShoulderStashRecentContactSeconds = 0.0444
fShoulderStashSustainedContactMissSeconds = 0.2
fShoulderStashHmdBackRightOffsetXGameUnits = 14
fShoulderStashHmdBackRightOffsetYGameUnits = -18
fShoulderStashHmdBackRightOffsetZGameUnits = -6.85
fShoulderStashHmdBackLeftOffsetXGameUnits = -14
fShoulderStashHmdBackLeftOffsetYGameUnits = -18
fShoulderStashHmdBackLeftOffsetZGameUnits = -6.85
fShoulderStashHmdBackRadiusGameUnits = 11
fShoulderStashHmdBackEnterPaddingGameUnits = 0
fShoulderStashHmdBackExitPaddingGameUnits = 2
fShoulderStashHmdBackMinBehindGameUnits = 4
bShoulderStashShowCollectedNotifications = true

; Mouth consume uses a tight HMD-relative sphere near the mouth.
; Only loose ALCH ingestibles can become mouth candidates; other objects use backpack stash/drop paths.
bMouthConsumeEnabled = true
bMouthConsumeAllowPoison = false
fMouthConsumeHmdOffsetXGameUnits = 0
fMouthConsumeHmdOffsetYGameUnits = 7
fMouthConsumeHmdOffsetZGameUnits = -7
fMouthConsumeRadiusGameUnits = 5.5
fMouthConsumeEnterPaddingGameUnits = 0
fMouthConsumeExitPaddingGameUnits = 1
fMouthConsumeMinDwellSeconds = 0.08
fMouthConsumeMaxSpeedGameUnitsPerSecond = 120

; Reduces player movement speed while carrying held mass.
bGrabHeldMassMovementSlowdownEnabled = true
fGrabHeldMassMovementMassProportion = 0.675
fGrabHeldMassMovementMassExponent = 1
fGrabHeldMassMovementMaxReduction = 75
fGrabHeldMassMovementFadeOutSeconds = 5

; === 09. Grab Acquisition ===
; Grab Press Leeway
; Keeps a held grab press alive while the hand becomes ready to grab (after a selection change, a pull catch or input suppression), so a press made a moment early still grabs.
; Releasing grab always cancels at once.
bGrabInputIntentStateEnabled = true

; Seconds a held grab press waits for the hand to become ready to grab. Range: 0 to 0.5.
fGrabInputLeewaySeconds = 0.12

; After that wait, seconds the held press keeps being sent every frame before ROCK stops trying. Range: 0 to 0.3.
fGrabInputForceSeconds = 0.08

; Distance from the hand pocket where an object is considered already touching.
fGrabTouchAcquireDistanceGameUnits = 4

; Distance where the object should converge into the palm pocket instead of finalizing immediately.
fGrabNearConvergeDistanceGameUnits = 28

; Hand-pocket offset and radius, in game units, from the root-flattened palm frame.
fGrabPocketDepthGameUnits = 7
fGrabPocketRadiusGameUnits = 9

; Legacy seat-depth stop and penetration backstop dimensions, in game units.
fGrabSeatDepthMaxGameUnits = 30
fGrabSeatDepthFootprintRadiusGameUnits = 10
fGrabSeatPenetrationBackstopFootprintRadiusGameUnits = 6
fGrabSeatDepthSkinGameUnits = 0.5

; 0 = Current seat. 1 = Local grasp solve.
; Applies on the next close grab of a loose object. Pulled, forced, pinched and authored grabs are unchanged.
; Mode 1 reads the mesh in front of the palm. A handle, neck, rim or round body is turned into the hand,
; and the fingers close on that part instead of the body behind it.
; When no such part is found the current seat is used. ROCK.log reports the result of each grab.
iGrabCloseSeatMode = 0

; Moves the captured grip point slightly inside the object from the raw hit/mesh seed.
fGrabGripInsetGameUnits = 2

; Optional near-converge diagnostic timeout. A value of 0 disables timeout promotion.
fGrabConvergeMaxTimeSeconds = 0.35
fGrabConvergeStableSeconds = 0.0333
fGrabConvergeMaxSeparatingSpeedGameUnitsPerSecond = 40
fGrabAcquisitionVisualStartDistanceGameUnits = 28

; === 10. Grab Contact Evidence ===
fGrabSurfaceBehindPalmToleranceGameUnits = 1.5

; Maximum age in seconds for semantic contacts used as touch evidence.
fGrabOppositionContactMaxAgeSeconds = 0.0556

; Small-object pinch pocket. Chosen only at close-grab commit, then frozen for the hold.
bGrabPinchPocketEnabled = true

; Allows a fallback close-selection cast along the pinch direction when the palm close cast misses.
bGrabPinchCloseSelectionEnabled = true

; Maximum whole-object bounding volume for pinch grabs, in cubic game units.
; Uses mesh width x height x depth with object scale; empty space inside the
; bounds counts. Length and thickness do not impose separate size limits.
fGrabPinchMaxVolumeCubicGameUnits = 100
fGrabPinchMaxPocketDistanceGameUnits = 8
fGrabPinchMinFingerGapGameUnits = 1
fGrabPinchMaxFingerGapGameUnits = 12
fGrabPinchThumbIndexMaxOpenValue = 0.45
fGrabPinchOtherFingerCurlValue = 0.2

; Pinch detection direction is authored in ROCK hand space: X=fingers, Y=palm depth, Z=signed cross-palm.
fGrabPinchDetectionDirectionHandspaceX = 1
fGrabPinchDetectionDirectionHandspaceY = 0
fGrabPinchDetectionDirectionHandspaceZ = 0

; Blends the live thumb-index axis with the authored pinch direction for mesh surface search.
fGrabPinchDetectionAxisBlend = 0.65

; Moves the rendered hand toward the mesh-matched held pose during grab startup.
bGrabHandLerpEnabled = true
fGrabHandLerpTimeMin = 0.1
fGrabHandLerpTimeMax = 0.2
fGrabHandLerpMinDistance = 7
fGrabHandLerpMaxDistance = 14

; Smooths the rendered hand back to live tracking after releasing a grabbed object.
bGrabHandReturnEnabled = true
fGrabHandReturnTimeMin = 0.1
fGrabHandReturnTimeMax = 0.2
fGrabHandReturnMinDistance = 7
fGrabHandReturnMaxDistance = 14
fGrabHandReturnMinAngleDegrees = 5
fGrabHandReturnMaxAngleDegrees = 90

; === 11. Finger Poses ===
; 0 = Follow grab finger mode. 1 = Current swept arc. 2 = July 9 calibrated slice.
; Applies on the next dynamic equipped weapon or part grip, on either hand.
; July 9 uses the contacted part, translation-only palm seating and captured finger directions.
; Uses current skeleton calibration and transform safety checks. Authored poses retain priority.
iWeaponGrabPoseMode = 0

; 1 = Current swept arc. 2 = June 2 legacy plane slice.
; Applies on the next dynamic weapon support grip when iWeaponGrabPoseMode = 0.
; Loose-object grabs use iLooseGrabFingerPoseMode.
; Legacy captures at contact and omits later pad refinement and splay.
; Authored and saved finger poses keep their existing priority.
iGrabFingerPoseMode = 1

; 0 = Capsule sweep.
; 1 = Swept arc: the finger solve loose grabs used before the capsule sweep
; (pad-probe refinement, contact splay, surface-aim local transforms).
; Applies on the next loose-object grab. Weapon grips use iWeaponGrabPoseMode.
iLooseGrabFingerPoseMode = 0

; Computes custom finger curl from the held object's visible mesh.
bGrabMeshFingerPoseEnabled = true

; Sends per-joint finger values to FRIK when available instead of one curl per finger.
bGrabMeshJointPoseEnabled = true

; Lowest allowed finger value. 0=fully closed, 1=fully straight.
fGrabFingerMinValue = 0.2

; Maximum per-second finger pose movement.
fGrabFingerPoseSmoothingSpeed = 14

; Uses FRIK's authored finger joint transforms plus bounded mesh-contact aim correction.
bGrabMeshLocalTransformPoseEnabled = true
fGrabFingerLocalTransformSmoothingSpeed = 14
fGrabFingerLocalTransformMaxCorrectionDegrees = 35
fGrabFingerSurfaceAimStrength = 0.75
bGrabFingerRejectBacksideHits = true
fGrabFingerSurfacePlaneToleranceGameUnits = 1.5

; Swept-arc finger solver: finger-pad contact sphere radius. Bigger = fingers
; stop earlier (hover), smaller = deeper wrap before contact.
; Finger-pad contact radius for the swept-arc solver (0.05-4). The old
; finger-width air gap was a solver bug (fixed: chord de-rotation), NOT this
; radius - values near 0 now make fingers clip into the mesh.
fGrabFingerSweepContactRadiusGameUnits = 0.6

; How far past the authored open pose fingers may hyper-extend when an
; object is thicker than the open finger span (hFRIK flex units: 1.0 =
; authored open pose, 2.0 = engine ceiling). The swept-arc close starts
; from the most-open allowed row, so a raised cap lets fingers lie flat
; on surfaces that interpenetrate the default open hand. Valid range
; 1.0-2.0; out-of-range silently falls back (1.4 fingers / 2.0 thumb).
fGrabFingerSweepMaxOpenValue = 2
fGrabThumbSweepMaxOpenValue = 1.5
fGrabThumbOppositionStrength = 1
fGrabThumbAlternateCurveStrength = 0.65
bGrabThumbSurfaceSafetyEnabled = true
fGrabThumbSurfaceSafetyMarginGameUnits = 1

; === 12. Mesh Contact ===
; Weighting used when choosing the best mesh triangle for grab contact.
fGrabLateralWeight = 0.6
fGrabDirectionalWeight = 0.4
fGrabMaxTriangleDistance = 100

; Prefers the visual mesh as the grab point; the object collision point is the fallback when no mesh surface is found.
bGrabMeshContactOnly = true
fGrabContactPatchMaxNormalAngleDegrees = 35

; Furthest the grab point may snap from the selection hit onto the mesh.
fGrabAlignmentMaxSelectionToMeshDistance = 8

; === 13. Close-Hand Curl ===
; Pre-curls the hand when close selection is active.
bSelectedCloseFingerCurlEnabled = true
fSelectedCloseFingerAnimMaxHandSpeed = 0.9
fSelectedCloseFingerAnimValue = 0.9

; === 14. Haptics ===
; Length of the pulse on the acting hand when the firing grip attaches or detaches, in seconds. Range: 0.01 to 0.5.
fFiringGripHapticDurationSeconds = 0.1

; Strength of the firing-grip attach pulse. Range: 0 to 1.
fFiringGripAttachHapticIntensity = 0.85

; Strength of the firing-grip detach pulse. Range: 0 to 1.
fFiringGripDetachHapticIntensity = 0.3

; Pulses for grab commit, pull start/catch, and held-object impacts.
bGrabHapticsEnabled = true
fGrabHapticDurationSeconds = 0.055
fGrabHapticBaseIntensity = 0.12
fGrabHapticMaxIntensity = 0.8
fGrabHapticMassScale = 0.06
fGrabHapticMassExponent = 0.6
fPullStartHapticIntensity = 0.18
fPullCatchHapticIntensity = 0.22
fSelectionLockHapticIntensity = 0.15
fSelectionLockReleaseHapticIntensity = 0.1
fSelectionLockReleaseHapticDurationSeconds = 0.02

; Fixed-surface grabs use a longer confirmation pulse.
bSurfaceGrabHapticsEnabled = true
fSurfaceGrabHapticDurationSeconds = 0.075
fSurfaceGrabHapticIntensity = 0.85
bHeldImpactHapticsEnabled = true
fHeldImpactHapticDurationSeconds = 0.035
fHeldImpactHapticBaseIntensity = 0.12
fHeldImpactHapticMaxIntensity = 0.85
fHeldImpactHapticSpeedScale = 0.006
fHeldImpactHapticMassScale = 0.035
fHeldImpactHapticMassExponent = 0.55
fHeldImpactHapticMinSpeedGameUnits = 8
fHeldImpactHapticCooldownSeconds = 0.12
fHeldImpactHapticDampedMultiplier = 0.55

; Shoulder stash haptics pulse clearly while an item is inside the stash zone, then fire a stronger confirmation on transfer.
bShoulderStashHapticsEnabled = true
fShoulderStashCandidateHapticDurationSeconds = 0.075
fShoulderStashCandidateHapticBaseIntensity = 0.2
fShoulderStashCandidateHapticIntensity = 0.42
fShoulderStashCandidateHapticIntervalSeconds = 0.075
fShoulderStashCommitHapticDurationSeconds = 0.12
fShoulderStashCommitHapticIntensity = 0.85

; Mouth consume haptics pulse while a consumable is in the mouth zone, then fire a confirmation on consume.
bMouthConsumeHapticsEnabled = true
fMouthConsumeCandidateHapticDurationSeconds = 0.05
fMouthConsumeCandidateHapticBaseIntensity = 0.22
fMouthConsumeCandidateHapticIntensity = 0.45
fMouthConsumeCandidateHapticIntervalSeconds = 0.075
fMouthConsumeCommitHapticDurationSeconds = 0.12
fMouthConsumeCommitHapticIntensity = 0.85

; Draws the hidden no-contact grab authority proxy target/axes used by ROCK dynamic grab.
bDebugDrawGrabAuthorityProxy = false

; === 15. Debug Overlay ===
; Master switch for all ROCK-owned collider visualizations below.
bDebugShowColliders = false

; Draws the selected or held target body when the collider master is enabled.
bDebugShowTargetColliders = false

; Draws live transform axes. Red=X, green=Y, blue=Z.
bDebugShowHandAxes = false

; Draws grab constraint pivots and the error line between hand-side and object-side pivots.
bDebugShowGrabPivots = false

; Draws the resolved mesh surface frame after a dynamic grab.
bDebugShowGrabPocketNormal = false

; Draws a focused held-grab pivot force/lever view: target pivot, live pivot, correction vector, lever arm, and torque witness.
bDebugDrawGrabForceTorque = false

; Adds a compact world label to the focused grab force/lever view.
bDebugDrawGrabForceTorqueText = false

; Draws the hknp body/collider that owns the frozen object-side pivot B.
bDebugDrawGrabPivotSourceCollider = false

; Draws the mesh triangle/contact-patch evidence that produced the frozen pivot.
bDebugDrawGrabPivotSourceEvidence = false

; Draws the frozen grab support face frame at pivot B: normal, support axis, and binormal.
bDebugDrawGrabSupportFrame = false

; Draws the live palm pocket and thumb/index pinch pocket for each hand.
bDebugDrawGrabPockets = false

; Draws palm center plus close/far selection aim rays.
bDebugShowPalmVectors = false

; More specific overlay filters and draw limits.
bDebugDrawHandColliders = false
bDebugDrawHandBoneColliders = false
bDebugDrawBodyBoneColliders = false
bDebugDrawDynamicHandColliders = false
bDebugDrawHandBoneContacts = false
